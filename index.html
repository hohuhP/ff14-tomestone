<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Tomestone - Live Sync</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .input-box { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        input, select { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 6px; flex: 1; min-width: 200px; font-size: 14px; }
        select { cursor: pointer; height: 45px; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        .profile-header { display: flex; gap: 20px; align-items: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 10px; background: #333; object-fit: cover; border: 2px solid var(--border); }
        .raid-item { margin-top: 15px; padding: 15px; background: #000; border-radius: 8px; border: 1px solid #333; }
        .log-detail { font-size: 14px; color: var(--sub); line-height: 1.6; border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
        a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="setup">
        <h3 style="margin-top:0;">🔗 FFLogs 실시간 연동 (한국 서버)</h3>
        <div class="input-box">
            <input type="text" id="client-id" placeholder="FFLogs Client ID">
            <input type="password" id="client-secret" placeholder="FFLogs Client Secret">
        </div>
        <div class="input-box">
            <input type="text" id="char-name" placeholder="캐릭터 이름">
            <select id="char-server">
                <option value="" disabled selected>서버를 선택하세요</option>
                <option value="Carbuncle">카벙클</option>
                <option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option>
                <option value="Tonberry">톤베리</option>
                <option value="Fenrir">펜리르</option>
            </select>
        </div>
        <button id="main-btn" onclick="fetchData()">데이터 찾기 시작</button>
    </div>

    <div class="card" style="display: none;" id="profile-section">
        <div class="profile-header">
            <img id="p-img" src="https://via.placeholder.com/100" class="profile-img" onclick="changePImg()">
            <div>
                <h2 id="p-name" style="margin:0;">이름</h2>
                <p id="p-server" style="margin:5px 0 0 0; color:var(--sub);">서버 정보</p>
            </div>
        </div>
    </div>

    <div id="raid-section" style="display: none;">
        <div class="card">
            <h3>⚔️ 최근 레이드 리포트</h3>
            <div id="raid-list"></div>
        </div>
    </div>
</div>

<script>
    async function fetchData() {
        const clientId = document.getElementById('client-id').value.trim();
        const clientSecret = document.getElementById('client-secret').value.trim();
        const name = document.getElementById('char-name').value.trim();
        const serverSlug = document.getElementById('char-server').value;
        const serverKR = document.getElementById('char-server').options[document.getElementById('char-server').selectedIndex].text;

        if(!clientId || !clientSecret || !name || !serverSlug) {
            return alert("모든 정보를 입력하고 서버를 선택해주세요!");
        }

        const btn = document.getElementById('main-btn');
        btn.innerText = "데이터 찾는 중...";
        btn.disabled = true;

        try {
            // 1. 토큰 가져오기
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${clientId}&client_secret=${clientSecret}`
            });
            
            if(!tokenRes.ok) throw new Error("API 인증에 실패했습니다. Client ID와 Secret을 확인하세요.");
            const tokenData = await tokenRes.json();
            const token = tokenData.access_token;

            // 2. 데이터 요청
            const query = `
            query {
              characterData {
                character(name: "${name}", serverSlug: "${serverSlug}", serverRegion: "KR") {
                  recentReports(limit: 10) {
                    data {
                      code
                      title
                      masterData { actors(type: "Player") { name subType } }
                    }
                  }
                }
              }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            
            const result = await res.json();

            // 중요: 에러가 있는지 먼저 확인
            if (result.errors) {
                throw new Error("FFLogs 에러: " + result.errors[0].message);
            }

            if (!result.data || !result.data.characterData || !result.data.characterData.character) {
                throw new Error(`${serverKR} 서버에서 '${name}' 캐릭터를 찾을 수 없거나 데이터가 비공개 상태입니다.`);
            }

            const char = result.data.characterData.character;

            // 3. 화면 업데이트
            document.getElementById('setup').style.display = 'none';
            document.getElementById('profile-section').style.display = 'block';
            document.getElementById('raid-section').style.display = 'block';
            document.getElementById('p-name').innerText = name;
            document.getElementById('p-server').innerText = serverKR + " 서버";

            const list = document.getElementById('raid-list');
            list.innerHTML = "";

            if (char.recentReports.data.length === 0) {
                list.innerHTML = "<p>최근 기록된 공개 로그가 없습니다.</p>";
            } else {
                char.recentReports.data.forEach(report => {
                    const party = report.masterData.actors.map(a => a.name).join(", ");
                    list.innerHTML += `
                        <div class="raid-item">
                            <strong>${report.title}</strong>
                            <div class="log-detail">
                                <strong>파티원:</strong> ${party.substring(0, 70)}...<br>
                                <a href="https://ko.fflogs.com/reports/${report.code}" target="_blank">로그 보기 ↗</a>
                            </div>
                        </div>
                    `;
                });
            }

        } catch (e) {
            alert(e.message);
            btn.innerText = "데이터 찾기 시작";
            btn.disabled = false;
        }
    }

    function changePImg() {
        const url = prompt("이미지 URL을 입력하세요.");
        if(url) document.getElementById('p-img').src = url;
    }
</script>

</body>
</html>
