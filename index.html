<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFLogs KR Report Manager</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 700px; }
        .settings-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input, select { background: #111; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
        .btn-main { background: var(--primary); color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
        .filter-container { margin-bottom: 20px; }
        .group-header { font-size: 13px; font-weight: bold; margin: 25px 0 10px 5px; color: var(--sub); display: flex; align-items: center; gap: 8px; }
        .group-header::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        .log-card { background: #000; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; border-left: 5px solid #444; }
        .log-card.is-clear { border-left-color: var(--clear); }
        .log-card.is-wipe { border-left-color: var(--wipe); }
        .log-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-radius: 12px 12px 0 0; }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #0a0a0a; padding: 12px; border-radius: 8px; }
        .player-item { font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px; background: #161616; border-radius: 4px; }
        .job-icon { width: 18px; height: 18px; }
        .status-msg { text-align: center; padding: 50px; color: var(--sub); }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-card">
        <div class="settings-grid">
            <input type="text" id="client-id" placeholder="Client ID">
            <input type="password" id="client-secret" placeholder="Client Secret">
            <input type="text" id="char-name" placeholder="캐릭터명">
            <select id="char-server">
                <option value="Carbuncle">카벙클</option>
                <option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option>
                <option value="Tonberry">톤베리</option>
                <option value="Fenrir">펜리르</option>
            </select>
        </div>
        <button class="btn-main" id="update-btn" onclick="saveAndFetch()">데이터 불러오기</button>
    </div>

    <div class="filter-container">
        <select id="category-select" onchange="render(this.value)">
            <option value="절">절 레이드</option>
            <option value="영식">영식</option>
            <option value="극">극 토벌전</option>
        </select>
    </div>

    <div id="main-content"></div>
</div>

<script>
    const bossDB = [
        { key: "Final Omega", name: "오메가 검증전", cat: "절" },
        { key: "Alpha", name: "오메가 검증전", cat: "절" },
        { key: "Dragon-king", name: "용시전쟁", cat: "절" },
        { key: "King Thordan", name: "용시전쟁", cat: "절" },
        { key: "Fatebreaker", name: "또 하나의 미래", cat: "절" },
        { key: "Perfect Alexander", name: "알렉산더", cat: "절" },
        { key: "Ultima Weapon", name: "알테마 웨폰", cat: "절" },
        { key: "Bahamut Prime", name: "바하무트", cat: "절" }
    ];

    let cachedFights = [];

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('fflogs_cfg') || '{}');
        if(saved.id) {
            document.getElementById('client-id').value = saved.id;
            document.getElementById('client-secret').value = saved.secret;
            document.getElementById('char-name').value = saved.name;
            document.getElementById('char-server').value = saved.server;
            fetchFFLogs(saved);
        }
    };

    function saveAndFetch() {
        const cfg = {
            id: document.getElementById('client-id').value.trim(),
            secret: document.getElementById('client-secret').value.trim(),
            name: document.getElementById('char-name').value.trim(),
            server: document.getElementById('char-server').value
        };
        localStorage.setItem('fflogs_cfg', JSON.stringify(cfg));
        fetchFFLogs(cfg);
    }

    async function fetchFFLogs(cfg) {
        const content = document.getElementById('main-content');
        const btn = document.getElementById('update-btn');
        content.innerHTML = '<div class="status-msg">연결 시도 중...</div>';
        btn.disabled = true;

        try {
            // 1. 토큰 획득
            const auth = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${cfg.id}&client_secret=${cfg.secret}`
            }).then(r => r.json());

            if (!auth.access_token) throw new Error("토큰 발급 실패");

            // 2. 데이터 쿼리
            const query = `query {
                characterData {
                    character(name: "${cfg.name}", serverSlug: "${cfg.server}", serverRegion: "KR") {
                        recentReports(limit: 50) {
                            data {
                                code
                                masterData { actors(type: "Player") { id name icon } }
                                fights { id kill name friendlyPlayers fightPercentage }
                            }
                        }
                    }
                }
            }`;

            const response = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${auth.access_token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query })
            }).then(r => r.json());

            const character = response.data?.characterData?.character;
            if (!character) throw new Error("캐릭터 정보를 찾을 수 없습니다.");

            cachedFights = [];
            const myName = cfg.name.toLowerCase().replace(/\s/g, "");

            character.recentReports.data.forEach(report => {
                const me = report.masterData.actors.find(a => a.name.toLowerCase().replace(/\s/g, "") === myName);
                if (!me) return;

                report.fights.forEach(f => {
                    if (!f.friendlyPlayers.includes(me.id)) return;
                    
                    let info = { name: f.name, cat: "기타" };
                    for (const b of bossDB) {
                        if (f.name.includes(b.key)) { info = b; break; }
                    }
                    cachedFights.push({ ...f, korName: info.name, category: info.cat, reportCode: report.code, actors: report.masterData.actors });
                });
            });

            render(document.getElementById('category-select').value);
        } catch (e) {
            content.innerHTML = `<div class="status-msg" style="color:var(--wipe);">${e.message}<br><small>API 키와 캐릭터 정보를 다시 확인해주세요.</small></div>`;
        } finally {
            btn.disabled = false;
        }
    }

    function render(cat) {
        const container = document.getElementById('main-content');
        const list = cachedFights.filter(f => f.category === cat);
        
        if (list.length === 0) {
            container.innerHTML = '<div class="status-msg">표시할 데이터가 없습니다.</div>';
            return;
        }

        container.innerHTML = list.map(f => `
            <div class="log-card ${f.kill ? 'is-clear' : 'is-wipe'}">
                <div class="log-header">
                    <b>${f.korName}</b>
                    <span style="color:${f.kill ? 'var(--clear)' : 'var(--wipe)'}">${f.kill ? 'CLEAR' : (f.fightPercentage/100).toFixed(1)+'%'}</span>
                </div>
                <div style="padding:15px;">
                    <div class="party-grid">
                        ${f.friendlyPlayers.map(pId => {
                            const p = f.actors.find(a => a.id === pId);
                            if (!p || p.name === "Limit Break") return '';
                            return `<div class="player-item">
                                <img src="https://assets.rpglogs.com/img/ff/icons/${p.icon}.png" class="job-icon">
                                <span>${p.name.split(' ')[0]}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
