<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Tomestone - Raid Manager</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 900px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        .raid-group-header { border-bottom: 2px solid var(--primary); margin: 30px 0 15px 0; padding-bottom: 5px; font-size: 20px; font-weight: bold; color: var(--primary); }
        
        .log-card { background: #000; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px; overflow: hidden; }
        .log-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #111; }
        .status-badge { padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .status-clear { background: var(--clear); color: white; }
        .status-wipe { background: var(--wipe); color: white; }
        
        .log-body { padding: 15px; }
        .party-list { font-size: 13px; color: var(--sub); margin-bottom: 10px; line-height: 1.4; }
        
        .gear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        input { background: #1a1c23; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 4px; font-size: 13px; width: 100%; box-sizing: border-box; }
        
        button { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-main { background: var(--primary); color: white; width: 100%; }
        .btn-save { background: #333; color: var(--sub); font-size: 12px; width: 100%; margin-top: 10px; }
        .btn-save:hover { background: var(--primary); color: white; }

        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: none; border: 1px solid var(--border); color: var(--sub); cursor: pointer; padding: 10px 20px; border-radius: 6px; }
        .tab-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="location.reload()">새로고침 & 데이터 동기화</button>
        <button class="tab-btn" onclick="toggleSettings()">설정 변경</button>
    </div>

    <div id="section-settings" class="card" style="display: none;">
        <h3>⚙️ 설정</h3>
        <input type="text" id="client-id" placeholder="Client ID" style="margin-bottom:10px;">
        <input type="password" id="client-secret" placeholder="Client Secret" style="margin-bottom:10px;">
        <input type="text" id="char-name" placeholder="캐릭터 이름" style="margin-bottom:10px;">
        <select id="char-server" style="background:#000; color:white; width:100%; padding:10px; margin-bottom:10px;">
            <option value="Carbuncle">카벙클</option>
            <option value="Chocobo">초코보</option>
            <option value="Moogle">모그리</option>
            <option value="Tonberry">톤베리</option>
            <option value="Fenrir">펜리르</option>
        </select>
        <button class="btn-main" onclick="saveSettings()">저장 후 새로고침</button>
    </div>

    <div id="main-content">
        <p style="text-align:center; color:var(--sub);">데이터를 불러오는 중...</p>
    </div>
</div>

<script>
    window.onload = function() {
        const saved = JSON.parse(localStorage.getItem('tomestone_cfg'));
        if(!saved) {
            document.getElementById('section-settings').style.display = 'block';
            document.getElementById('main-content').innerHTML = '';
        } else {
            fetchData(saved);
        }
    };

    function toggleSettings() {
        const s = document.getElementById('section-settings');
        s.style.display = s.style.display === 'none' ? 'block' : 'none';
    }

    function saveSettings() {
        const cfg = {
            id: document.getElementById('client-id').value.trim(),
            secret: document.getElementById('client-secret').value.trim(),
            name: document.getElementById('char-name').value.trim(),
            server: document.getElementById('char-server').value
        };
        localStorage.setItem('tomestone_cfg', JSON.stringify(cfg));
        location.reload();
    }

    async function fetchData(saved) {
        try {
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${saved.id}&client_secret=${saved.secret}`
            });
            const tokenData = await tokenRes.json();
            const token = tokenData.access_token;

            const query = `query {
                characterData {
                    character(name: "${saved.name}", serverSlug: "${saved.server}", serverRegion: "KR") {
                        recentReports(limit: 20) {
                            data {
                                code
                                title
                                startTime
                                fights { kill }
                                masterData { actors(type: "Player") { name subType } }
                            }
                        }
                    }
                }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const result = await res.json();
            const reports = result.data.characterData.character.recentReports.data;

            renderLogs(reports);
        } catch (e) {
            document.getElementById('main-content').innerHTML = `<p style='color:red;'>오류: ${e.message}</p>`;
        }
    }

    function renderLogs(reports) {
        const container = document.getElementById('main-content');
        container.innerHTML = "";

        const grouped = {};
        reports.forEach(r => {
            if (!grouped[r.title]) grouped[r.title] = [];
            grouped[r.title].push(r);
        });

        for (const title in grouped) {
            const groupSection = document.createElement('div');
            groupSection.innerHTML = `<div class="raid-group-header">⚔️ ${title}</div>`;
            
            grouped[title].forEach(report => {
                const kills = report.fights.filter(f => f.kill).length;
                const wipes = report.fights.filter(f => !f.kill).length;
                const isClear = kills > 0;
                const party = report.masterData.actors.map(a => a.name).join(", ");
                const reportCode = report.code;
                
                const gear = JSON.parse(localStorage.getItem('gear_' + reportCode)) || {w:'', m:''};

                const logHtml = `
                    <div class="log-card">
                        <div class="log-header">
                            <span style="font-size:14px; font-weight:bold;">Code: ${reportCode}</span>
                            <span class="status-badge ${isClear ? 'status-clear' : 'status-wipe'}">
                                ${isClear ? '클리어' : '리트'} (${wipes}회)
                            </span>
                        </div>
                        <div class="log-body">
                            <div class="party-list"><strong>8인 파티:</strong> ${party}</div>
                            <div style="font-size:12px; margin-bottom:10px;">
                                <a href="https://ko.fflogs.com/reports/${reportCode}" target="_blank" style="color:var(--primary); text-decoration:none;">리포트 상세 보기 ↗</a>
                            </div>
                            <div class="gear-grid">
                                <input type="text" id="w-${reportCode}" value="${gear.w}" placeholder="무기">
                                <input type="text" id="m-${reportCode}" value="${gear.m}" placeholder="마테리아/메모">
                            </div>
                            <button class="btn-save" onclick="saveGear('${reportCode}')">메모 저장</button>
                        </div>
                    </div>
                `;
                groupSection.innerHTML += logHtml;
            });
            container.appendChild(groupSection);
        }
    }

    function saveGear(code) {
        const data = {
            w: document.getElementById('w-' + code).value,
            m: document.getElementById('m-' + code).value
        };
        localStorage.setItem('gear_' + code, JSON.stringify(data));
        alert("저장되었습니다.");
    }
</script>

</body>
</html>
