<!-- 이전 스타일 시트는 동일하게 유지되므로 스크립트 로직의 핵심 변경 부분만 반영합니다 -->
<script>
    // ... (설정 및 토큰 획득 부분은 동일)

    async function fetchData(saved) {
        try {
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${saved.id}&client_secret=${saved.secret}`
            });
            const tokenData = await tokenRes.json();
            const token = tokenData.access_token;

            // 쿼리 시 인원을 체크하기 위해 masterData의 actors를 가져옵니다.
            const query = `query {
                characterData {
                    character(name: "${saved.name}", serverSlug: "${saved.server}", serverRegion: "KR") {
                        recentReports(limit: 50) { 
                            data {
                                code
                                title
                                fights { kill }
                                masterData { actors(type: "Player") { name } }
                            }
                        }
                    }
                }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const result = await res.json();
            
            // 전체 로그 중 '8인 로그'만 필터링
            const allReports = result.data.characterData.character.recentReports.data;
            const eightManReports = allReports.filter(r => r.masterData.actors.length === 8);

            renderLogs(eightManReports, saved.name);
        } catch (e) {
            document.getElementById('main-content').innerHTML = `<p style='color:red;'>오류: ${e.message}</p>`;
        }
    }

    function renderLogs(reports, myName) {
        const container = document.getElementById('main-content');
        container.innerHTML = "";

        if (reports.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:var(--sub);'>최근 8인 레이드 기록이 없습니다.</p>";
            return;
        }

        // 레이드 제목별로 그룹은 지어주되, 내부의 각 로그는 무조건 별개 카드로 출력
        const grouped = {};
        reports.forEach(r => {
            if (!grouped[r.title]) grouped[r.title] = [];
            grouped[r.title].push(r);
        });

        for (const title in grouped) {
            const groupSection = document.createElement('div');
            groupSection.innerHTML = `<div class="raid-group-header">${title}</div>`;
            
            grouped[title].forEach(report => {
                const kills = report.fights.filter(f => f.kill).length;
                const wipes = report.fights.filter(f => !f.kill).length;
                const isClear = kills > 0;
                const reportCode = report.code;
                
                const savedData = JSON.parse(localStorage.getItem('gear_' + reportCode)) || {w:'', m:''};

                groupSection.innerHTML += `
                    <div class="log-card">
                        <div class="log-header">
                            <span class="status-badge ${isClear ? 'status-clear' : 'status-wipe'}">
                                ${isClear ? '클리어' : '리트'}
                            </span>
                            <span style="font-size:12px; color:var(--sub); font-family:monospace;">ID: ${reportCode}</span>
                            <span style="font-size:12px; font-weight:bold; color:var(--sub);">${wipes}회 트라이</span>
                        </div>
                        <div class="log-body">
                            <div class="party-summary">👤 <b>8인 파티</b> 리포트</div>
                            <div class="gear-row">
                                <input type="text" id="w-${reportCode}" value="${savedData.w}" placeholder="무기 정보">
                                <input type="text" id="m-${reportCode}" value="${savedData.m}" placeholder="세팅 메모">
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <a href="https://ko.fflogs.com/reports/${reportCode}" target="_blank" class="btn-link">리포트 상세보기 ↗</a>
                                <button class="btn-save" onclick="saveGear('${reportCode}')">저장</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.appendChild(groupSection);
        }
    }
</script>
