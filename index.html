<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Gear Search & Log Manager</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .nav-tabs { display: flex; gap: 10px; margin: 0; position: sticky; top: 0; z-index: 100; background: rgba(13, 14, 18, 0.9); backdrop-filter: blur(10px); padding: 15px; width: 100%; justify-content: center; border-bottom: 1px solid var(--border); }
        .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--sub); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .container { width: 100%; max-width: 850px; padding: 20px; box-sizing: border-box; }
        .hidden { display: none; }

        /* 장비 슬롯 디자인 */
        .gear-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gear-slot { background: #111; padding: 12px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; }
        .gear-slot:hover { border-color: var(--primary); }
        .materia-dot { width: 7px; height: 7px; border-radius: 50%; background: #222; border: 1px solid #444; }
        .materia-dot.active { background: var(--primary); box-shadow: 0 0 5px var(--primary); border: none; }

        /* 검색 모달 스타일 */
        #search-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: #222; border: 1px solid var(--primary); border-radius: 12px; z-index: 1000; padding: 20px; display: none; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .search-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; box-sizing: border-box; margin-bottom: 15px; }
        .search-results { max-height: 300px; overflow-y: auto; }
        .search-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; font-size: 14px; }
        .search-item:hover { background: #333; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 999; display: none; }

        .status-msg { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('log')">전투 기록 분석</button>
    <button class="tab-btn" onclick="switchTab('gear')">장비/마테리아 설정</button>
</div>

<div id="log-section" class="container">
    <div class="status-msg" id="db-status">DB 로딩 중...</div>
    <div id="log-display-area">
        <p style="text-align:center; color:var(--sub);">DB 로드가 완료되면 로그 데이터를 불러올 수 있습니다.</p>
    </div>
</div>

<div id="gear-section" class="container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 id="gear-target-name" style="margin:0;">플레이어 장비 분석</h2>
        <div style="font-size: 24px; font-weight: bold; color: var(--primary);">iLvl <span id="avg-ilvl-display">0</span></div>
    </div>
    <div class="gear-grid" id="gear-slots-grid"></div>
</div>

<!-- 검색 모달 -->
<div class="overlay" id="overlay" onclick="closeSearch()"></div>
<div id="search-modal">
    <h3 style="margin-top:0;">장비 검색</h3>
    <input type="text" class="search-input" id="item-search" placeholder="아이템 이름 입력..." oninput="searchItem(this.value)">
    <div class="search-results" id="search-results"></div>
</div>

<script>
    let itemDB = []; // CSV 데이터 저장소
    let currentSlotIdx = null;
    const slotNames = ["머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];

    // 1. GitHub CSV 로드 및 파싱
    async function initDB() {
        try {
            const url = "https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv";
            const res = await fetch(url);
            const text = await res.text();
            
            // CSV 파싱 (매우 간소화된 버전)
            const rows = text.split('\n').slice(3); // 헤더 제외
            itemDB = rows.map(row => {
                const cols = row.split(',');
                return {
                    id: cols[0],
                    name: cols[1]?.replace(/"/g, ''), // 이름
                    lvl: parseInt(cols[12]) || 0,     // 아이템 레벨 (LevelItem)
                    materia: parseInt(cols[72]) || 0  // 마테리아 슬롯 수 (MateriaSlotCount)
                };
            }).filter(i => i.name && i.lvl > 100); // 100레벨 이상의 유의미한 데이터만

            document.getElementById('db-status').innerText = "DB 로드 완료 - 장비를 설정할 수 있습니다.";
            initGearGrid();
        } catch (e) {
            document.getElementById('db-status').innerText = "DB 로드 실패 (네트워크 확인)";
        }
    }

    // 2. 장비 슬롯 생성
    function initGearGrid() {
        const grid = document.getElementById('gear-slots-grid');
        grid.innerHTML = slotNames.map((name, i) => `
            <div class="gear-slot" onclick="openSearch(${i})">
                <div style="width:36px; height:36px; background:#000; border-radius:4px; border:1px solid #444;"></div>
                <div style="flex-grow:1">
                    <div style="font-size:10px; color:var(--sub)">${name}</div>
                    <div id="item-name-${i}" style="font-size:13px; font-weight:bold;">장비 선택</div>
                    <div style="display:flex; gap:3px; margin-top:4px;" id="m-container-${i}">
                        ${[1,2,3,4,5].map(m => `<div class="materia-dot"></div>`).join('')}
                    </div>
                </div>
                <div style="color:var(--primary); font-size:12px; font-weight:bold;">iLvl <span id="item-lvl-${i}">0</span></div>
            </div>
        `).join('');
    }

    // 3. 검색 기능
    function openSearch(idx) {
        currentSlotIdx = idx;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('search-modal').style.display = 'block';
        document.getElementById('item-search').value = "";
        document.getElementById('search-results').innerHTML = "";
        document.getElementById('item-search').focus();
    }

    function closeSearch() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('search-modal').style.display = 'none';
    }

    function searchItem(query) {
        if(query.length < 2) return;
        const results = itemDB.filter(i => i.name.includes(query)).slice(0, 20);
        
        const html = results.map(i => `
            <div class="search-item" onclick="selectItem('${i.name}', ${i.lvl}, ${i.materia})">
                [iLvl ${i.lvl}] ${i.name}
            </div>
        `).join('');
        document.getElementById('search-results').innerHTML = html;
    }

    function selectItem(name, lvl, materiaCount) {
        const idx = currentSlotIdx;
        document.getElementById(`item-name-${idx}`).innerText = name;
        document.getElementById(`item-lvl-${idx}`).innerText = lvl;
        
        // 마테리아 슬롯 시각화
        const mArea = document.getElementById(`m-container-${idx}`);
        mArea.innerHTML = [1,2,3,4,5].map(m => 
            `<div class="materia-dot ${m <= materiaCount ? 'active' : ''}"></div>`
        ).join('');

        updateAvgLvl();
        closeSearch();
    }

    function updateAvgLvl() {
        let total = 0;
        for(let i=0; i<10; i++) total += parseInt(document.getElementById(`item-lvl-${i}`).innerText || 0);
        document.getElementById('avg-ilvl-display').innerText = (total / 10).toFixed(1);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        if(tab === 'log') {
            document.getElementById('log-section').classList.remove('hidden');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else {
            document.getElementById('gear-section').classList.remove('hidden');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        }
    }

    initDB(); // DB 로드 시작
</script>
</body>
</html>
