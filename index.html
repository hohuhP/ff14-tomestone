<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFLogs KR Report Manager</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 700px; }
        .settings-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input, select { background: #111; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        .btn-main { background: var(--primary); color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .filter-container { margin-bottom: 20px; }
        .filter-label { font-size: 12px; color: var(--sub); margin-bottom: 8px; display: block; margin-left: 5px; }
        .group-header { font-size: 13px; font-weight: bold; margin: 25px 0 10px 5px; color: var(--sub); display: flex; align-items: center; gap: 8px; }
        .group-header::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        .log-card { background: #000; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; border-left: 5px solid #444; overflow: hidden; }
        .log-card.is-clear { border-left-color: var(--clear); }
        .log-card.is-wipe { border-left-color: var(--wipe); }
        .log-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #0a0a0a; padding: 12px; border-radius: 8px; }
        .player-item { font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px; background: #161616; border-radius: 4px; text-align: center; }
        .job-icon { width: 18px; height: 18px; }
        .job-tank { color: #2d71c1; } .job-healer { color: #467837; } .job-dps { color: #ad413d; }
        .status-msg { text-align: center; padding: 60px; color: var(--sub); font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-card">
        <div class="settings-grid">
            <input type="text" id="client-id" placeholder="FFLogs Client ID">
            <input type="password" id="client-secret" placeholder="Client Secret">
            <input type="text" id="char-name" placeholder="캐릭터 이름">
            <select id="char-server">
                <option value="Carbuncle">카벙클</option>
                <option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option>
                <option value="Tonberry">톤베리</option>
                <option value="Fenrir">펜리르</option>
            </select>
        </div>
        <button class="btn-main" id="fetch-btn" onclick="saveSettings()">데이터 갱신 및 저장</button>
    </div>

    <div class="filter-container">
        <label class="filter-label">콘텐츠 카테고리 선택</label>
        <select id="category-select" onchange="render(this.value)">
            <option value="절">절 레이드 (Ultimate)</option>
            <option value="영식">영웅 난이도 (Savage)</option>
            <option value="극">극 토벌전 (Extreme)</option>
            <option value="기타">기타 콘텐츠 (Etc)</option>
        </select>
    </div>

    <div id="main-content"></div>
</div>

<script>
    const bossDB = [
        { key: "Fatebreaker", name: "또 하나의 미래", cat: "절" },
        { key: "Usurper", name: "또 하나의 미래", cat: "절" },
        { key: "Eden Prime", name: "또 하나의 미래", cat: "절" },
        { key: "Oracle", name: "또 하나의 미래", cat: "절" },
        { key: "Final Omega", name: "오메가 검증전", cat: "절" },
        { key: "Alpha", name: "오메가 검증전", cat: "절" },
        { key: "Dragon-king", name: "용시전쟁", cat: "절" },
        { key: "King Thordan", name: "용시전쟁", cat: "절" },
        { key: "Perfect Alexander", name: "알렉산더", cat: "절" },
        { key: "Alexander Prime", name: "알렉산더", cat: "절" },
        { key: "Ultima Weapon", name: "알테마 웨폰", cat: "절" },
        { key: "Bahamut Prime", name: "바하무트", cat: "절" },
        { key: "Lindwurm", name: "린드블룸", cat: "영식" },
        { key: "The Tyrant", name: "더 타이런트", cat: "영식" },
        { key: "Red Hot", name: "레드 핫", cat: "영식" },
        { key: "Deep Blue", name: "딥 블루", cat: "영식" },
        { key: "Vamp Fatale", name: "뱀프 파탈", cat: "영식" },
        { key: "Eternal Darkness", name: "영원한 어둠", cat: "극" },
        { key: "Valigarmanda", name: "발리가르만다", cat: "극" },
        { key: "Enuo", name: "에누오", cat: "극" },
        { key: "Zoraal Ja", name: "조라자", cat: "극" },
        { key: "Eternal Queen", name: "이터널 퀸", cat: "극" },
        { key: "Doomtrain", name: "글라시아 라볼라스", cat: "극" },
        { key: "Jelenia", name: "젤레니아", cat: "극" }
    ];

    const jobIcons = {
        Tank: ['Paladin', 'Warrior', 'DarkKnight', 'Gunbreaker'],
        Healer: ['WhiteMage', 'Scholar', 'Astrologian', 'Sage'],
        Dps: ['Monk', 'Dragoon', 'Ninja', 'Samurai', 'Reaper', 'Bard', 'Machinist', 'Dancer', 'BlackMage', 'Summoner', 'RedMage', 'Pictomancer', 'Viper']
    };

    let fights = [];

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('tomestone_cfg'));
        if(saved) {
            document.getElementById('client-id').value = saved.id || '';
            document.getElementById('client-secret').value = saved.secret || '';
            document.getElementById('char-name').value = saved.name || '';
            document.getElementById('char-server').value = saved.server || 'Carbuncle';
            if(saved.id && saved.secret && saved.name) fetchData(saved);
        }
    };

    function saveSettings() {
        const cfg = {
            id: document.getElementById('client-id').value.trim(),
            secret: document.getElementById('client-secret').value.trim(),
            name: document.getElementById('char-name').value.trim(),
            server: document.getElementById('char-server').value
        };
        if(!cfg.id || !cfg.secret || !cfg.name) { alert("모든 정보를 입력해주세요."); return; }
        localStorage.setItem('tomestone_cfg', JSON.stringify(cfg));
        fetchData(cfg);
    }

    async function fetchData(saved) {
        const content = document.getElementById('main-content');
        const btn = document.getElementById('fetch-btn');
        content.innerHTML = `<div class="status-msg">FFLogs에서 데이터를 불러오는 중...</div>`;
        btn.disabled = true;

        try {
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${saved.id}&client_secret=${saved.secret}`
            });

            if(!tokenRes.ok) throw new Error("AUTH_FAILED");
            const { access_token } = await tokenRes.json();

            const query = `query {
                characterData {
                    character(name: "${saved.name}", serverSlug: "${saved.server}", serverRegion: "KR") {
                        recentReports(limit: 100) { 
                            data {
                                code
                                masterData { actors(type: "Player") { id name icon } }
                                fights { id kill name friendlyPlayers encounterID fightPercentage }
                            }
                        }
                    }
                }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });

            const result = await res.json();
            if (result.errors) throw new Error("QUERY_ERROR");

            const character = result.data.characterData.character;
            if (!character) {
                content.innerHTML = `<div class="status-msg" style="color:var(--wipe);">캐릭터를 찾을 수 없습니다. 이름과 서버를 확인하세요.</div>`;
                return;
            }

            fights = [];
            const searchName = saved.name.replace(/\s/g, "").toLowerCase();

            character.recentReports.data.forEach(r => {
                const myActor = r.masterData.actors.find(a => a.name.replace(/\s/g, "").toLowerCase() === searchName);
                if(!myActor) return;

                r.fights.forEach(f => {
                    if (f.name.toLowerCase().includes('trash')) return;
                    if (!f.friendlyPlayers.includes(myActor.id)) return;

                    let info = { name: f.name.replace(/\(.*\)|절 |극 /g, "").trim(), cat: "기타" };
                    for (const b of bossDB) {
                        if (f.name.toLowerCase().includes(b.key.toLowerCase())) {
                            info = b;
                            break;
                        }
                    }
                    fights.push({ ...f, reportCode: r.code, actors: r.masterData.actors, korName: info.name, category: info.cat });
                });
            });

            render(document.getElementById('category-select').value);
        } catch (e) {
            console.error(e);
            content.innerHTML = `<div class="status-msg" style="color:var(--wipe);">네트워크 오류 또는 API 한도 초과입니다.<br>잠시 후 다시 시도하거나 ID/Secret을 확인하세요.</div>`;
        } finally {
            btn.disabled = false;
        }
    }

    function render(cat) {
        const container = document.getElementById('main-content');
        const list = fights.filter(f => f.category === cat);
        const clears = list.filter(f => f.kill);
        const wipes = list.filter(f => !f.kill);

        let html = "";
        if(clears.length > 0) html += `<div class="group-header">SUCCESS</div>` + clears.map(f => logItem(f)).join('');
        if(wipes.length > 0) html += `<div class="group-header">FAILED</div>` + wipes.map(f => logItem(f)).join('');
        
        container.innerHTML = html || `<div class="status-msg">해당 카테고리에 기록이 없습니다.</div>`;
    }

    function logItem(f) {
        let wipePercent = (f.fightPercentage / 100).toFixed(1);
        if (!f.kill && (wipePercent === "0.0" || wipePercent === "0")) wipePercent = "0.1";

        const prog = f.kill 
            ? `<span style="color:var(--clear); font-weight:bold;">CLEAR</span>` 
            : `<span style="color:var(--wipe); font-weight:bold;">${wipePercent}%</span>`;
        
        const party = (f.friendlyPlayers || []).map(pId => {
            const a = f.actors.find(x => x.id === pId);
            if(!a || a.name === "Limit Break" || a.name.includes("Multiple")) return null;
            const jobClass = jobIcons.Tank.includes(a.icon) ? 'job-tank' : jobIcons.Healer.includes(a.icon) ? 'job-healer' : 'job-dps';
            return `<div class="player-item"><img src="https://assets.rpglogs.com/img/ff/icons/${a.icon}.png" class="job-icon"><div class="${jobClass}">${a.name.split(' ')[0]}</div></div>`;
        }).filter(x => x).slice(0, 8).join('');

        return `
            <div class="log-card ${f.kill ? 'is-clear' : 'is-wipe'}">
                <div class="log-header">
                    <b style="font-size:14px;">${f.korName}</b>
                    <span style="font-size:13px;">${prog}</span>
                </div>
                <div style="padding:15px;">
                    <div class="party-grid">${party}</div>
                    <div style="margin-top:12px; font-size:11px; display:flex; justify-content:space-between; color:var(--sub);">
                        <span>CODE: ${f.reportCode}</span>
                        <a href="https://ko.fflogs.com/reports/${f.reportCode}#fight=${f.id}" target="_blank" style="color:var(--primary); text-decoration:none; font-weight:bold;">LOGS ↗</a>
                    </div>
                </div>
            </div>`;
    }
</script>
</body>
</html>
