<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV KR-Log Final Editor</title>
    <style>
        :root { 
            --bg: #0b0c10; --card: #14151a; --primary: #a855f7; --text: #e5e7eb; --sub: #9ca3af; --border: #262626; --accent: #10b981;
            --rank-gold: #ffb100; --rank-pink: #e268a8; --rank-orange: #ff8000; --rank-purple: #a335ee;
            --rank-blue: #0070ff; --rank-green: #1eff00; --rank-grey: #666;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; }
        .wrapper { max-width: 1200px; margin: 0 auto; }
        
        /* 1. 설정 패널 */
        .config-panel { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 25px; }
        .auth-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 15px; }
        .char-grid { display: grid; grid-template-columns: 80px 1.5fr 1.5fr auto; gap: 10px; }
        
        .input-field, .select-field { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; outline: none; width: 100%; box-sizing: border-box; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); }

        /* 2. 던전 탭 & 리스트 */
        .tab-bar { display: none; margin-bottom: 15px; border-bottom: 1px solid var(--border); gap: 10px; }
        .tab { padding: 12px 20px; cursor: pointer; color: var(--sub); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
        
        #fight-list { display: none; background: #16171d; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #222; }
        .fight-card { background: #22252e; border: 1px solid #333; padding: 15px; border-radius: 8px; cursor: pointer; margin: 6px; display: inline-flex; align-items: center; gap: 15px; }
        .rank-badge { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; text-shadow: 1px 1px 2px #000; }

        /* 3. 에디터 메인 */
        #editor-ui { display: none; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 25px; background: #111; border-radius: 15px; border-left: 5px solid var(--primary); }
        .gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 15px; }
        .gear-card { background: var(--card); border: 1px solid #222; padding: 18px; border-radius: 12px; display: flex; align-items: center; gap: 15px; }
        .gear-card.editable { border-color: var(--primary); cursor: pointer; box-shadow: 0 0 10px rgba(168, 85, 247, 0.1); }
        
        .item-img { width: 54px; height: 54px; border-radius: 8px; border: 1px solid #333; }
        .mat-list { display: flex; gap: 5px; margin-top: 10px; }
        .mat-node { width: 24px; height: 24px; border-radius: 50%; background: #000; border: 1px solid #444; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; backdrop-filter: blur(5px); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; background: var(--card); border: 1px solid var(--primary); border-radius: 20px; z-index: 1000; padding: 30px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="config-panel">
        <h3 style="margin-top:0; color:var(--primary);">FFLogs V2 API 인증 & 캐릭터 설정</h3>
        <div class="auth-grid">
            <input type="text" id="client-id" class="input-field" placeholder="Client ID">
            <input type="password" id="client-secret" class="input-field" placeholder="Client Secret">
            <button class="btn" style="background:#444" onclick="getAccessToken()">토큰 발급</button>
        </div>
        <div class="char-grid" style="margin-top:15px;">
            <input type="text" class="input-field" value="KR" readonly style="text-align:center; background:#1a1a1a; font-weight:bold; color:var(--accent);">
            <select id="server-select" class="select-field">
                <option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option>
                <option value="Carbuncle">카벙클</option>
                <option value="Tonberry">톤베리</option>
                <option value="Fenrir">펜리르</option>
            </select>
            <input type="text" id="char-name" class="input-field" placeholder="캐릭터 닉네임">
            <button class="btn" onclick="fetchReports()">로그 불러오기</button>
        </div>
        <p id="auth-status" style="font-size:12px; color:var(--sub); margin: 10px 0 0 0;">인증 정보가 필요합니다.</p>
    </div>

    <div id="tab-bar" class="tab-bar">
        <div class="tab active" onclick="filterFights('all', this)">전체</div>
        <div class="tab" onclick="filterFights('ultimate', this)">절 (Ultimate)</div>
        <div class="tab" onclick="filterFights('savage', this)">영식 (Savage)</div>
        <div class="tab" onclick="filterFights('extreme', this)">극 (Extreme)</div>
    </div>

    <div id="fight-list"></div>

    <div id="editor-ui">
        <div class="header-bar">
            <div>
                <h2 id="view-title" style="margin:0;">전투를 선택하세요</h2>
                <div id="view-user" style="color:var(--sub); margin-top:5px;">-</div>
            </div>
            <div style="text-align:right">
                <button id="edit-mode-btn" class="btn" style="background:var(--accent)" onclick="toggleEdit()">모든 장비 수정 모드</button>
                <div id="view-ilvl" style="font-size:30px; font-weight:900; color:var(--primary); margin-top:5px;">i000.00</div>
            </div>
        </div>
        <div id="gear-grid" class="gear-grid"></div>
    </div>
</div>

<div id="modal-overlay" class="overlay" onclick="closeModal()"></div>
<div id="search-modal" class="modal">
    <h3 id="modal-header" style="margin-top:0;">항목 검색</h3>
    <input type="text" id="search-input" class="input-field" placeholder="아이템 이름 입력..." oninput="searchDB(this.value)">
    <div id="search-results" style="max-height: 350px; overflow-y: auto; margin-top: 20px;"></div>
</div>

<script>
    let itemDB = [], matDB = [];
    let reports = [], isEdit = false;
    let gearState = [], activeIdx = { s: null, m: null };
    let accessToken = "";

    const getRankColor = (p) => p>=100?'var(--rank-gold)':p>=99?'var(--rank-pink)':p>=95?'var(--rank-orange)':p>=75?'var(--rank-purple)':p>=50?'var(--rank-blue)':p>=25?'var(--rank-green)':'var(--rank-grey)';

    async function init() {
        const res = await fetch("https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv");
        const text = await res.text();
        itemDB = text.split('\n').slice(3).map(l => {
            const c = l.split(',');
            return { id: c[0], name: c[1]?.replace(/"/g,''), icon: c[2]?.padStart(6,'0'), ilvl: parseInt(c[12])||0 };
        }).filter(i => i.name);
        matDB = itemDB.filter(i => i.name.includes("마테리"));
    }

    async function getAccessToken() {
        const id = document.getElementById('client-id').value;
        const secret = document.getElementById('client-secret').value;
        try {
            const res = await fetch("https://www.fflogs.com/oauth/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `grant_type=client_credentials&client_id=${id}&client_secret=${secret}`
            });
            const data = await res.json();
            if(data.access_token) {
                accessToken = data.access_token;
                document.getElementById('auth-status').innerText = "인증 성공!";
                document.getElementById('auth-status').style.color = "var(--accent)";
            } else { throw new Error(); }
        } catch(e) { 
            alert("인증 실패!"); 
        }
    }

    async function fetchReports() {
        if(!accessToken) return alert("토큰을 발급받으세요.");
        const name = document.getElementById('char-name').value;
        const server = document.getElementById('server-select').value;
        const query = `query { characterData { character(name: "${name}", serverSlug: "${server}", serverRegion: "KR") { 
            recentReports(limit: 10) { data { code title fights(killType: Kills) { id name difficulty } } } 
        }}}`;
        const res = await fetch("https://www.fflogs.com/api/v2/client", {
            method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${accessToken}` },
            body: JSON.stringify({ query })
        });
        const json = await res.json();
        reports = json.data.characterData.character.recentReports.data;
        document.getElementById('tab-bar').style.display = 'flex';
        document.getElementById('fight-list').style.display = 'block';
        filterFights('all', document.querySelector('.tab'));
    }

    function filterFights(type, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        let html = "";
        reports.forEach(r => {
            let targets = r.fights;
            if(type === 'ultimate') targets = r.fights.filter(f => f.difficulty === 5);
            else if(type === 'savage') targets = r.fights.filter(f => f.difficulty === 101);
            else if(type === 'extreme') targets = r.fights.filter(f => f.difficulty === 10);
            targets.forEach(f => {
                const p = Math.floor(Math.random() * 100);
                html += `<div class="fight-card" onclick="loadGear('${r.code}', ${f.id}, '${f.name}', ${p})">
                    <div class="rank-badge" style="background:${getRankColor(p)}">${p}</div>
                    <div style="font-weight:bold;">${f.name}</div>
                </div>`;
            });
        });
        document.getElementById('fight-list').innerHTML = html || "기록 없음";
    }

    async function loadGear(code, fid, fname, pct) {
        const query = `query { reportData { report(code: "${code}") { table(fightIDs: [${fid}], dataType: Casts) } } }`;
        const res = await fetch("https://www.fflogs.com/api/v2/client", {
            method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${accessToken}` },
            body: JSON.stringify({ query })
        });
        const json = await res.json();
        const player = json.data.reportData.report.table.data.playerDetails[0];
        gearState = player.gear.map(g => ({
            id: String(g.id),
            mats: g.materia ? g.materia.map(m => String(m.id)) : Array(5).fill(null)
        }));
        document.getElementById('view-title').innerHTML = `${fname} <span style="color:${getRankColor(pct)}">(${pct})</span>`;
        document.getElementById('view-user').innerText = player.name;
        document.getElementById('editor-ui').style.display = 'block';
        renderEditor();
    }

    function renderEditor() {
        const labels = ["주무기", "보조", "머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지1", "반지2"];
        let sum = 0;
        document.getElementById('gear-grid').innerHTML = gearState.map((g, i) => {
            const it = itemDB.find(x => x.id === g.id) || { name: "알 수 없음", icon: "000001", ilvl: 0 };
            sum += it.ilvl;
            return `
                <div class="gear-card ${isEdit ? 'editable' : ''}" onclick="${isEdit ? `openModal(${i}, null)` : ''}">
                    <img class="item-img" src="https://xivapi.com/i/${it.icon.substring(0,3)}000/${it.icon}.png">
                    <div style="flex:1">
                        <div style="font-size:10px; color:var(--sub);">${labels[i]}</div>
                        <div style="font-weight:bold; font-size:13px; color:#fff;">${it.name}</div>
                        <div class="mat-list">
                            ${g.mats.map((mid, midx) => {
                                const m = matDB.find(mx => mx.id === mid);
                                return `<div class="mat-node" onclick="${isEdit ? `event.stopPropagation(); openModal(${i}, ${midx})` : ''}">
                                    ${m ? `<img src="https://xivapi.com/i/${m.icon.substring(0,3)}000/${m.icon}.png" width="100%">` : ''}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                    <div style="font-weight:bold; color:var(--accent);">i${it.ilvl}</div>
                </div>`;
        }).join('');
        document.getElementById('view-ilvl').innerText = `i${(sum/12).toFixed(2)}`;
    }

    function toggleEdit() {
        isEdit = !isEdit;
        const btn = document.getElementById('edit-mode-btn');
        btn.innerText = isEdit ? "수정 완료" : "모든 장비 수정 모드";
        btn.style.background = isEdit ? "#3b82f6" : "var(--accent)";
        renderEditor();
    }

    function openModal(s, m) {
        activeIdx = { s, m };
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('search-modal').style.display = 'block';
    }

    function searchDB(q) {
        if(q.length < 2) return;
        const pool = activeIdx.m === null ? itemDB : matDB;
        const res = pool.filter(i => i.name.includes(q)).slice(0, 15);
        document.getElementById('search-results').innerHTML = res.map(i => `
            <div style="display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer;" onclick="applySelection('${i.id}')">
                <img src="https://xivapi.com/i/${i.icon.substring(0,3)}000/${i.icon}.png" width="36">
                <div><b>${i.name}</b><br><small>iLvl ${i.ilvl}</small></div>
            </div>`).join('');
    }

    function applySelection(id) {
        if(activeIdx.m === null) gearState[activeIdx.s].id = id;
        else gearState[activeIdx.s].mats[activeIdx.m] = id;
        renderEditor(); closeModal();
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('search-modal').style.display = 'none';
    }

    init();
</script>
</body>
</html>
