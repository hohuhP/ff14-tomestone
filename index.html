<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Gear Record Inspector</title>
    <style>
        :root { --bg: #0d0e12; --card: #14151a; --primary: #a855f7; --text: #e5e7eb; --sub: #9ca3af; --border: #262626; --accent: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 950px; }

        /* [1] 상단 설정 영역: API 키, 닉네임, 서버 선택 */
        .config-section { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 8px; text-transform: uppercase; }
        .input-field { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; box-sizing: border-box; outline: none; }
        .input-field:focus { border-color: var(--primary); }
        .btn-update { width: 100%; background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-update:hover { opacity: 0.8; }

        /* [2] 장비 상세 뷰어 패널 (팀원 클릭 시 노출) */
        .inspector-panel { background: #0a0a0c; border: 1px solid var(--primary); border-radius: 12px; padding: 25px; margin-bottom: 30px; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .inspector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .gear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .gear-item { background: #111; border: 1px solid #222; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 15px; }
        .gear-img { width: 44px; height: 44px; border-radius: 4px; border: 1px solid #444; background: #000; }

        /* [3] 리포트 및 파티원 목록 */
        .report-card { background: var(--card); border-left: 4px solid #ff4444; border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .member-node { background: #1a1c23; border: 1px solid #333; padding: 12px; border-radius: 4px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.1s; }
        .member-node:hover { border-color: var(--primary); background: #252832; }
        .job-icon { width: 22px; height: 22px; }

        select.report-selector { width: 100%; background: #1a1c23; color: #fff; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 설정 섹션 -->
    <div class="config-section">
        <div class="input-row">
            <div class="input-group">
                <label>FFLogs API Key</label>
                <input type="password" id="api-key" class="input-field" placeholder="API Key">
            </div>
            <div class="input-group">
                <label>Client Secret</label>
                <input type="password" id="client-secret" class="input-field" placeholder="Client Secret">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>Character Name</label>
                <input type="text" id="char-name" class="input-field" placeholder="닉네임을 입력하세요">
            </div>
            <div class="input-group">
                <label>Server</label>
                <select id="server-select" class="input-field">
                    <option value="Chocobo">초코보</option>
                    <option value="Moogle">모그리</option>
                    <option value="Carbuncle">카벙클</option>
                    <option value="Tonberry">톤베리</option>
                    <option value="Fenrir">펜리르</option>
                    <option value="Shinryu">신룡</option>
                    <option value="Bahamut">바하무트</option>
                </select>
            </div>
        </div>
        <button class="btn-update" onclick="updateData()">본인 로그 데이터 갱신</button>
    </div>

    <!-- 리포트 선택 -->
    <select class="report-selector">
        <option>전체 리포트</option>
        <option>절 또 하나의 미래 (진행중)</option>
    </select>

    <!-- 장비 뷰어 (상세 정보 전용) -->
    <div id="inspector" class="inspector-panel">
        <div class="inspector-header">
            <div>
                <h2 id="target-user" style="margin: 0; color: #fff;">-</h2>
                <div id="target-job" style="font-size: 12px; color: var(--sub); text-transform: uppercase;">Job Name</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 11px; color: var(--sub);">AVERAGE ILVL</div>
                <div id="avg-ilvl-val" style="font-size: 32px; font-weight: bold; color: var(--accent);">0.00</div>
            </div>
        </div>
        <div id="gear-display" class="gear-grid"></div>
        <button onclick="document.getElementById('inspector').style.display='none'" style="margin-top:20px; width:100%; background:#222; border:none; color:#aaa; padding:10px; cursor:pointer; border-radius:6px; font-weight:bold;">닫기</button>
    </div>

    <!-- 리포트 목록 -->
    <div class="report-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; font-size:18px;">절 또 하나의 미래</span>
            <span style="color:#ff4444; font-weight:bold; font-size:18px;">1.0%</span>
        </div>
        <div class="party-grid" id="member-list">
            <!-- 자바스크립트로 렌더링 -->
        </div>
    </div>
</div>

<script>
    let itemDB = new Map();
    const slotNames = ["주무기", "보조무기", "머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];

    // 1. 아이템 데이터베이스 로드
    async function init() {
        try {
            const res = await fetch("https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv");
            const text = await res.text();
            text.split('\n').slice(3).forEach(line => {
                const c = line.split(',');
                if(c[0]) {
                    itemDB.set(c[0].trim(), { 
                        name: c[1]?.replace(/"/g,''), 
                        icon: c[2]?.padStart(6,'0'), 
                        ilvl: parseInt(c[12])||0 
                    });
                }
            });
            renderMembers();
        } catch(e) { console.error("DB 로드 실패"); }
    }

    // 2. 가상의 멤버 데이터
    const members = [
        { name: "번탈녀", job: "Warrior", gear: ["42431", "42432", "42433", "42434", "42435", "42436", "42437", "42438", "42439", "42440", "42441", "42441"] },
        { name: "가웨인", job: "Dragoon", gear: ["42442", "0", "42443", "42444", "42445", "42446", "42447", "42448", "42449", "42450", "42451", "42451"] },
        { name: "예현", job: "WhiteMage", gear: ["42453", "0", "42454", "42455", "42456", "42457", "42458", "42459", "42460", "42461", "42462", "42462"] },
        { name: "참영", job: "Scholar", gear: ["42453", "0", "42454", "42455", "42456", "42457", "42458", "42459", "42460", "42461", "42462", "42462"] }
    ];

    function renderMembers() {
        document.getElementById('member-list').innerHTML = members.map(m => `
            <div class="member-node" onclick="inspectGear('${m.name}', '${m.job}', ${JSON.stringify(m.gear)})">
                <img src="https://assets.rpglogs.com/img/ff/icons/${m.job}.png" class="job-icon">
                <span style="font-size:13px;">${m.name}</span>
            </div>
        `).join('');
    }

    // 3. 장비 인스펙터 실행 (평균 레벨 자동 계산 및 아이콘 매핑)
    function inspectGear(name, job, gearIds) {
        let totalIlvl = 0;
        const html = gearIds.map((id, i) => {
            const item = itemDB.get(id.toString()) || { name: "정보 없음", ilvl: 0, icon: "000001" };
            totalIlvl += item.ilvl;
            
            const iconFolder = item.icon.substring(0, 3) + "000";
            const iconUrl = `https://xivapi.com/i/${iconFolder}/${item.icon}.png`;

            return `
                <div class="gear-item">
                    <img src="${iconUrl}" class="gear-img" onerror="this.src='https://xivapi.com/i/000000/000001.png'">
                    <div style="flex-grow:1; overflow:hidden;">
                        <div style="font-size:9px; color:var(--sub);">${slotNames[i]}</div>
                        <div style="font-size:11px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">${item.name}</div>
                    </div>
                    <div style="font-size:11px; color:var(--primary); font-weight:bold;">i${item.ilvl}</div>
                </div>
            `;
        }).join('');

        document.getElementById('target-user').innerText = name;
        document.getElementById('target-job').innerText = job;
        document.getElementById('avg-ilvl-val').innerText = (totalIlvl / 12).toFixed(2);
        document.getElementById('gear-display').innerHTML = html;
        document.getElementById('inspector').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 4. 데이터 갱신 버튼
    function updateData() {
        const char = document.getElementById('char-name').value;
        const server = document.getElementById('server-select').value;
        if(!char) { alert("캐릭터명을 입력해주세요."); return; }
        alert(`${char}@${server} 서버 데이터를 확인합니다.`);
    }

    init();
</script>
</body>
</html>
