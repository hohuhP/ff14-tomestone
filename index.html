<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Tactical Log & Gear Manager</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; --ana: #3b82f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* 네비게이션 */
        .nav-tabs { display: flex; gap: 10px; margin: 0; position: sticky; top: 0; z-index: 100; background: rgba(13, 14, 18, 0.9); backdrop-filter: blur(10px); padding: 15px; width: 100%; justify-content: center; border-bottom: 1px solid var(--border); }
        .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--sub); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }

        .container { width: 100%; max-width: 850px; padding: 20px; box-sizing: border-box; }
        .hidden { display: none; }

        /* 설정 카드 */
        .settings-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input, select { background: #111; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
        .btn-main { background: var(--primary); color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 로그 리스트 */
        .log-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; border-left: 5px solid #444; overflow: hidden; }
        .log-card.is-clear { border-left-color: var(--clear); }
        .log-card.is-wipe { border-left-color: var(--wipe); }
        .log-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; background: rgba(0,0,0,0.1); }
        
        /* 플레이어 버튼 (장비 연동) */
        .player-btn { background: #161616; border: 1px solid #333; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; }
        .player-btn:hover { border-color: var(--primary); background: #222; transform: translateY(-2px); }
        .job-icon { width: 20px; height: 20px; margin-bottom: 4px; }

        /* 장비 시뮬레이터 */
        .gear-container { background: var(--card); border-radius: 15px; padding: 25px; border: 1px solid var(--border); }
        .gear-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gear-slot { background: #111; padding: 12px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .materia-dot { width: 7px; height: 7px; border-radius: 50%; background: #222; border: 1px solid #444; }
        .materia-dot.active { background: var(--primary); box-shadow: 0 0 5px var(--primary); border: none; }
        
        .status-msg { text-align: center; padding: 40px; color: var(--sub); }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('log')">전투 기록 분석</button>
    <button class="tab-btn" id="gear-tab-btn" onclick="switchTab('gear')">장비/마테리아 설정</button>
</div>

<!-- 1. 로그 섹션 -->
<div id="log-section" class="container">
    <div class="settings-card">
        <div class="settings-grid">
            <input type="text" id="client-id" placeholder="FFLogs Client ID">
            <input type="password" id="client-secret" placeholder="Client Secret">
            <input type="text" id="char-name" placeholder="캐릭터 이름">
            <select id="char-server">
                <option value="Carbuncle">카벙클</option>
                <option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option>
                <option value="Tonberry">톤베리</option>
                <option value="Fenrir">펜리르</option>
            </select>
        </div>
        <button class="btn-main" onclick="saveSettings()">로그 데이터 및 본인 참여 확인</button>
    </div>

    <div style="margin-bottom: 15px;">
        <select id="category-select" onchange="renderLogs(this.value)">
            <option value="전체">전체 보기</option>
            <option value="절">절 레이드</option>
            <option value="극">극 토벌전</option>
            <option value="영식">영식</option>
        </select>
    </div>

    <div id="log-display-area">
        <div class="status-msg">데이터를 불러오면 여기에 표시됩니다.</div>
    </div>
</div>

<!-- 2. 장비 섹션 -->
<div id="gear-section" class="container hidden">
    <div class="gear-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;">
            <div>
                <h2 id="gear-target-name" style="margin:0; color:var(--primary);">플레이어 선택 안됨</h2>
                <span id="gear-fight-info" style="font-size:12px; color:var(--sub);">로그 탭에서 인원을 클릭하세요</span>
            </div>
            <div style="text-align: right;">
                <div style="font-size:24px; font-weight:bold;">iLvl <span id="avg-ilvl-display">0</span></div>
                <button class="btn-main" onclick="saveCurrentGearSet()" style="padding: 5px 15px; margin-top: 10px;">이 로그에 장비 저장</button>
            </div>
        </div>

        <div class="gear-grid" id="gear-slots-grid">
            <!-- 장비 슬롯 10개 렌더링 영역 -->
        </div>
    </div>
</div>

<script>
    // [설정] 보스 DB 및 시간 기준 (진행도 로직용)
    const bossDB = [
        { key: "Fatebreaker", name: "절 또 하나의 미래", cat: "절", maxTime: 1100 },
        { key: "Final Omega", name: "절 오메가", cat: "절", maxTime: 1140 },
        { key: "Dragon-king", name: "절 용시전쟁", cat: "절", maxTime: 1120 },
        { key: "Zereneia", name: "극 제레니아", cat: "극", maxTime: 600 },
        { key: "Eternal Darkness", name: "극 영원한 어둠", cat: "극", maxTime: 660 },
        { key: "Glasya Labolas", name: "극 글라시아 라볼라스", cat: "극", maxTime: 630 }
    ];

    let allFights = [];
    let currentLogKey = ""; 
    const slotNames = ["머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('fflogs_mgr_cfg'));
        if(saved) {
            document.getElementById('client-id').value = saved.id || '';
            document.getElementById('client-secret').value = saved.secret || '';
            document.getElementById('char-name').value = saved.name || '';
            document.getElementById('char-server').value = saved.server || 'Carbuncle';
            if(saved.id && saved.name) fetchLogs(saved);
        }
        initGearGrid();
    };

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        if(tab === 'log') {
            document.getElementById('log-section').classList.remove('hidden');
            document.querySelector('button[onclick="switchTab(\'log\')"]').classList.add('active');
        } else {
            document.getElementById('gear-section').classList.remove('hidden');
            document.getElementById('gear-tab-btn').classList.add('active');
        }
    }

    // --- 로그 로직 ---
    async function fetchLogs(cfg) {
        const display = document.getElementById('log-display-area');
        display.innerHTML = `<div class="status-msg">본인 참여 기록 필터링 중...</div>`;

        try {
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${cfg.id}&client_secret=${cfg.secret}`
            });
            const { access_token } = await tokenRes.json();

            const query = `query {
                characterData {
                    character(name: "${cfg.name}", serverSlug: "${cfg.server}", serverRegion: "KR") {
                        recentReports(limit: 50) { 
                            data {
                                code
                                masterData { actors(type: "Player") { id name icon } }
                                fights { id kill name friendlyPlayers startTime endTime }
                            }
                        }
                    }
                }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            }).then(r => r.json());

            allFights = [];
            const myName = cfg.name.toLowerCase().replace(/\s/g, "");

            res.data.characterData.character.recentReports.data.forEach(r => {
                const me = r.masterData.actors.find(a => a.name.toLowerCase().replace(/\s/g, "") === myName);
                if(!me) return;

                r.fights.forEach(f => {
                    if(f.name.includes("Trash") || !f.friendlyPlayers.includes(me.id)) return;

                    let info = { name: f.name, cat: "기타", maxTime: 600 };
                    for (const b of bossDB) { if (f.name.includes(b.key)) { info = b; break; } }

                    allFights.push({ 
                        ...f, reportCode: r.code, actors: r.masterData.actors, 
                        korName: info.name, category: info.cat, 
                        duration: (f.endTime - f.startTime) / 1000, maxTime: info.maxTime 
                    });
                });
            });
            renderLogs("전체");
        } catch (e) { display.innerHTML = `<div class="status-msg" style="color:var(--wipe);">데이터 로드 실패</div>`; }
    }

    function renderLogs(cat) {
        const area = document.getElementById('log-display-area');
        const list = cat === "전체" ? allFights : allFights.filter(f => f.category === cat);
        
        area.innerHTML = list.map(f => {
            const progress = Math.min((f.duration / f.maxTime) * 100, 100).toFixed(1);
            const party = f.friendlyPlayers.map(pId => {
                const p = f.actors.find(a => a.id === pId);
                if(!p || p.name.toLowerCase().includes("multiple")) return '';
                return `
                    <div class="player-btn" onclick="openGearSim('${p.name}', '${f.reportCode}', '${f.id}', '${f.korName}')">
                        <img src="https://assets.rpglogs.com/img/ff/icons/${p.icon}.png" class="job-icon">
                        <div style="font-size:10px; color:var(--sub)">${p.name.split(' ')[0]}</div>
                    </div>`;
            }).join('');

            return `
                <div class="log-card ${f.kill ? 'is-clear' : 'is-wipe'}">
                    <div class="log-header">
                        <b>${f.korName}</b>
                        <span style="font-weight:bold; color:${f.kill ? 'var(--clear)' : 'var(--wipe)'}">${f.kill ? 'CLEAR' : progress + '%'}</span>
                    </div>
                    <div class="party-grid">${party}</div>
                </div>`;
        }).join('');
    }

    // --- 장비 시뮬레이터 로직 ---
    function initGearGrid() {
        const grid = document.getElementById('gear-slots-grid');
        grid.innerHTML = slotNames.map((name, i) => `
            <div class="gear-slot" onclick="mockSelectItem(${i})">
                <div style="width:36px; height:36px; background:#000; border-radius:4px; border:1px solid #444;"></div>
                <div style="flex-grow:1">
                    <div style="font-size:10px; color:var(--sub)">${name}</div>
                    <div id="item-name-${i}" style="font-size:13px; font-weight:bold;">장비 선택</div>
                    <div style="display:flex; gap:3px; margin-top:4px;">
                        ${[1,2,3,4,5].map(m => `<div class="materia-dot" id="m-${i}-${m}"></div>`).join('')}
                    </div>
                </div>
                <div style="color:var(--primary); font-size:12px; font-weight:bold;">iLvl <span id="item-lvl-${i}">0</span></div>
            </div>
        `).join('');
    }

    function openGearSim(pName, rCode, fId, boss) {
        currentLogKey = `gear_${rCode}_${fId}_${pName}`;
        document.getElementById('gear-target-name').innerText = pName;
        document.getElementById('gear-fight-info').innerText = `${boss} (Code: ${rCode})`;
        loadSavedGear();
        switchTab('gear');
    }

    function mockSelectItem(idx) {
        const name = prompt("장비 이름을 입력하세요 (GitHub DB 연동 지점):", slotNames[idx] + " 유물");
        const lvl = prompt("아이템 레벨을 입력하세요:", "730");
        if(name && lvl) {
            document.getElementById(`item-name-${idx}`).innerText = name;
            document.getElementById(`item-lvl-${idx}`).innerText = lvl;
            updateAvgLvl();
        }
    }

    function updateAvgLvl() {
        let total = 0;
        for(let i=0; i<10; i++) total += parseInt(document.getElementById(`item-lvl-${i}`).innerText || 0);
        document.getElementById('avg-ilvl-display').innerText = (total / 10).toFixed(1);
    }

    function saveCurrentGearSet() {
        const set = [];
        for(let i=0; i<10; i++) {
            set.push({
                name: document.getElementById(`item-name-${i}`).innerText,
                lvl: document.getElementById(`item-lvl-${i}`).innerText
            });
        }
        localStorage.setItem(currentLogKey, JSON.stringify(set));
        alert("이 로그의 장비 세팅이 저장되었습니다.");
    }

    function loadSavedGear() {
        const saved = JSON.parse(localStorage.getItem(currentLogKey));
        if(saved) {
            saved.forEach((item, i) => {
                document.getElementById(`item-name-${i}`).innerText = item.name;
                document.getElementById(`item-lvl-${i}`).innerText = item.lvl;
            });
        } else {
            for(let i=0; i<10; i++) {
                document.getElementById(`item-name-${i}`).innerText = "미설정";
                document.getElementById(`item-lvl-${i}`).innerText = "0";
            }
        }
        updateAvgLvl();
    }

    function saveSettings() {
        const cfg = {
            id: document.getElementById('client-id').value.trim(),
            secret: document.getElementById('client-secret').value.trim(),
            name: document.getElementById('char-name').value.trim(),
            server: document.getElementById('char-server').value
        };
        localStorage.setItem('fflogs_mgr_cfg', JSON.stringify(cfg));
        fetchLogs(cfg);
    }
</script>
</body>
</html>
