<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Tactical Log & Gear</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* 상단 탭 */
        .nav-tabs { display: flex; gap: 10px; margin: 20px 0; position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 10px; width: 100%; justify-content: center; }
        .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--sub); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .container { width: 100%; max-width: 900px; padding: 0 20px 50px 20px; }
        .hidden { display: none; }

        /* 장비 슬롯 디자인 */
        .gear-container { background: var(--card); border-radius: 15px; padding: 25px; border: 1px solid var(--border); }
        .gear-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .gear-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .gear-slot { background: #111; padding: 12px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .gear-slot:hover { border-color: var(--primary); }
        .slot-label { font-size: 11px; color: var(--sub); margin-bottom: 2px; }
        .item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .materia-container { display: flex; gap: 3px; margin-top: 5px; }
        .materia-slot { width: 7px; height: 7px; border-radius: 50%; background: #222; border: 1px solid #444; }
        .materia-slot.active { background: var(--primary); box-shadow: 0 0 4px var(--primary); border: none; }

        /* 로그 카드 */
        .log-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; border-left: 5px solid #444; }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; }
        .player-btn { background: #0a0a0a; border: 1px solid #222; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; }
        .player-btn:hover { border-color: var(--primary); }
        
        .save-banner { background: var(--clear); color: black; font-weight: bold; text-align: center; padding: 5px; border-radius: 4px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('log')">전투 기록</button>
    <button class="tab-btn" id="gear-tab-btn" onclick="switchTab('gear')">장비/마테 설정</button>
</div>

<!-- 로그 섹션 -->
<div id="log-section" class="container">
    <div id="log-list">
        <!-- 로그 데이터 로드 후 여기에 플레이어 버튼들이 생성됨 -->
        <p style="text-align: center; color: var(--sub);">로그 데이터를 불러온 뒤 파티원을 클릭해 장비를 설정하세요.</p>
    </div>
</div>

<!-- 장비 설정 섹션 -->
<div id="gear-section" class="container hidden">
    <div class="gear-container">
        <div class="gear-header">
            <div>
                <h3 id="current-target-name" style="margin:0;">플레이어 미선택</h3>
                <span id="current-fight-info" style="font-size:12px; color:var(--sub);">로그를 선택해주세요</span>
            </div>
            <div style="text-align: right;">
                <div style="font-size:20px; font-weight:bold; color:var(--primary);">Avg. iLvl <span id="avg-ilvl">0</span></div>
                <button onclick="saveGearData()" style="background:var(--primary); border:none; color:white; padding:5px 15px; border-radius:4px; cursor:pointer; margin-top:5px;">이 세팅 저장</button>
            </div>
        </div>

        <div class="gear-grid" id="gear-grid-display">
            <!-- 10개 슬롯 (머리, 상의, 장갑, 하의, 신발, 귀걸이, 목걸이, 팔찌, 반지1, 반지2) -->
        </div>
        <div id="save-msg" class="save-banner">장비 설정이 저장되었습니다!</div>
    </div>
</div>

<script>
    const slots = ["머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];
    let currentLogKey = ""; // reportCode_fightId_playerName 형식

    // 1. 탭 전환
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        if(tab === 'log') {
            document.getElementById('log-section').classList.remove('hidden');
            document.querySelector('button[onclick="switchTab(\'log\')"]').classList.add('active');
        } else {
            document.getElementById('gear-section').classList.remove('hidden');
            document.getElementById('gear-tab-btn').classList.add('active');
            renderGearSlots();
        }
    }

    // 2. 특정 로그의 파티원 클릭 시 실행
    function inspectPlayer(playerName, reportCode, fightId, bossName) {
        currentLogKey = `${reportCode}_${fightId}_${playerName}`;
        document.getElementById('current-target-name').innerText = playerName;
        document.getElementById('current-fight-info').innerText = `${bossName} (${reportCode})`;
        
        switchTab('gear');
        loadGearData(); // 저장된 데이터가 있으면 불러오기
    }

    // 3. 장비 슬롯 렌더링
    function renderGearSlots() {
        const display = document.getElementById('gear-grid-display');
        display.innerHTML = slots.map((slot, idx) => `
            <div class="gear-slot" onclick="selectItem(${idx})">
                <div style="width:32px; height:32px; background:#000; border-radius:4px;"></div>
                <div style="flex-grow:1">
                    <div class="slot-label">${slot}</div>
                    <div class="item-name" id="slot-name-${idx}">장비 검색/선택</div>
                    <div class="materia-container" id="materia-area-${idx}">
                        ${[1,2,3,4,5].map(m => `<div class="materia-slot" id="m-dot-${idx}-${m}"></div>`).join('')}
                    </div>
                </div>
                <div style="color:var(--primary); font-weight:bold; font-size:12px;">iLvl <span id="slot-ilvl-${idx}">0</span></div>
            </div>
        `).join('');
    }

    // 4. 데이터 저장 및 불러오기 (localStorage 활용)
    function saveGearData() {
        if(!currentLogKey) return alert("로그를 먼저 선택해주세요.");
        
        const gearSet = [];
        let totalLvl = 0;

        for(let i=0; i<10; i++) {
            const item = {
                name: document.getElementById(`slot-name-${i}`).innerText,
                ilvl: parseInt(document.getElementById(`slot-ilvl-${i}`).innerText),
                materiaCount: 2 // 예시로 2개 박힌 것으로 처리
            };
            gearSet.push(item);
            totalLvl += item.ilvl;
        }

        const data = {
            gearSet,
            avgLvl: (totalLvl / 10).toFixed(1)
        };

        localStorage.setItem(`gear_${currentLogKey}`, JSON.stringify(data));
        
        const msg = document.getElementById('save-msg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 2000);
    }

    function loadGearData() {
        const saved = localStorage.getItem(`gear_${currentLogKey}`);
        if(saved) {
            const data = JSON.parse(saved);
            data.gearSet.forEach((item, i) => {
                document.getElementById(`slot-name-${i}`).innerText = item.name;
                document.getElementById(`slot-ilvl-${i}`).innerText = item.ilvl;
                // 마테리아 시각화
                for(let m=1; m<=5; m++) {
                    const dot = document.getElementById(`m-dot-${i}-${m}`);
                    if(m <= item.materiaCount) dot.classList.add('active');
                    else dot.classList.remove('active');
                }
            });
            document.getElementById('avg-ilvl').innerText = data.avgLvl;
        } else {
            // 데이터 없을 시 초기화
            document.getElementById('avg-ilvl').innerText = "0";
            for(let i=0; i<10; i++) {
                document.getElementById(`slot-name-${i}`).innerText = "장비 검색/선택";
                document.getElementById(`slot-ilvl-${i}`).innerText = "0";
            }
        }
    }

    // 5. 아이템 선택 시뮬레이션 (CSV 연동 지점)
    function selectItem(slotIdx) {
        // 실제 구현 시 여기서 GitHub CSV 데이터를 fetch하여 검색창을 띄웁니다.
        const fakeName = slots[slotIdx] + " 유물 장비";
        const fakeLvl = 730;
        
        document.getElementById(`slot-name-${slotIdx}`).innerText = fakeName;
        document.getElementById(`slot-ilvl-${slotIdx}`).innerText = fakeLvl;
        
        // 평균 템렙 실시간 갱신
        let total = 0;
        for(let i=0; i<10; i++) {
            total += parseInt(document.getElementById(`slot-ilvl-${i}`).innerText);
        }
        document.getElementById('avg-ilvl').innerText = (total / 10).toFixed(1);
    }
</script>

</body>
</html>
