<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFLogs KR Report Manager</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; --ana: #3b82f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 700px; }
        .settings-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input, select { background: #111; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
        .btn-main { background: var(--primary); color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .filter-container { margin-bottom: 20px; }
        .log-card { background: #000; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; border-left: 5px solid #444; overflow: hidden; }
        .log-card.is-clear { border-left-color: var(--clear); }
        .log-card.is-wipe { border-left-color: var(--wipe); }
        .log-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #0a0a0a; padding: 12px; border-radius: 8px; }
        .player-link { text-decoration: none; display: block; transition: transform 0.1s; }
        .player-link:hover { transform: translateY(-2px); }
        .player-item { font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px; background: #161616; border-radius: 4px; text-align: center; cursor: pointer; }
        .job-icon { width: 18px; height: 18px; border-radius: 2px; }
        .status-msg { text-align: center; padding: 50px; color: var(--sub); font-size: 14px; }
        .link-group { margin-top: 12px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222; padding-top: 10px; }
        .external-links { display: flex; gap: 12px; }
        .ext-link { text-decoration: none; font-weight: bold; }
        .report-link { color: var(--primary); }
        .analysis-link { color: var(--ana); }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-card">
        <div class="settings-grid">
            <input type="text" id="client-id" placeholder="FFLogs Client ID">
            <input type="password" id="client-secret" placeholder="Client Secret">
            <input type="text" id="char-name" placeholder="캐릭터 이름">
            <select id="char-server">
                <option value="Carbuncle">카벙클</option>
                <option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option>
                <option value="Tonberry">톤베리</option>
                <option value="Fenrir">펜리르</option>
            </select>
        </div>
        <button class="btn-main" id="fetch-btn" onclick="saveSettings()">모든 데이터 불러오기</button>
    </div>

    <div class="filter-container">
        <select id="category-select" onchange="render(this.value)">
            <option value="전체">모든 전투 (Trash 포함)</option>
            <option value="절">절 레이드</option>
            <option value="영식">영식</option>
            <option value="극">극 토벌전</option>
            <option value="기타">기타</option>
        </select>
    </div>

    <div id="main-content"></div>
</div>

<script>
    const bossDB = [
        { key: "Fatebreaker", name: "또 하나의 미래", cat: "절" },
        { key: "Usurper", name: "또 하나의 미래", cat: "절" },
        { key: "Eden Prime", name: "또 하나의 미래", cat: "절" },
        { key: "Oracle", name: "또 하나의 미래", cat: "절" },
        { key: "Final Omega", name: "오메가 검증전", cat: "절" },
        { key: "Dragon-king", name: "용시전쟁", cat: "절" },
        { key: "Perfect Alexander", name: "알렉산더", cat: "절" },
        { key: "Ultima Weapon", name: "알테마 웨폰", cat: "절" },
        { key: "Bahamut Prime", name: "바하무트", cat: "절" }
    ];

    let fights = [];
    let currentServer = "Carbuncle";

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('fflogs_mgr_cfg'));
        if(saved) {
            document.getElementById('client-id').value = saved.id || '';
            document.getElementById('client-secret').value = saved.secret || '';
            document.getElementById('char-name').value = saved.name || '';
            document.getElementById('char-server').value = saved.server || 'Carbuncle';
            if(saved.id && saved.name) fetchData(saved);
        }
    };

    function saveSettings() {
        const cfg = {
            id: document.getElementById('client-id').value.trim(),
            secret: document.getElementById('client-secret').value.trim(),
            name: document.getElementById('char-name').value.trim(),
            server: document.getElementById('char-server').value
        };
        localStorage.setItem('fflogs_mgr_cfg', JSON.stringify(cfg));
        fetchData(cfg);
    }

    async function fetchData(cfg) {
        const content = document.getElementById('main-content');
        content.innerHTML = `<div class="status-msg">강제 데이터 동기화 중...</div>`;
        currentServer = cfg.server;

        try {
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${cfg.id}&client_secret=${cfg.secret}`
            });
            const { access_token } = await tokenRes.json();

            // 필터 없는 광범위 쿼리
            const query = `query {
                characterData {
                    character(name: "${cfg.name}", serverSlug: "${cfg.server}", serverRegion: "KR") {
                        recentReports(limit: 50) { 
                            data {
                                code
                                masterData { actors(type: "Player") { id name icon } }
                                fights { id kill name friendlyPlayers fightPercentage }
                            }
                        }
                    }
                }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            }).then(r => r.json());

            const character = res.data.characterData.character;
            if(!character) throw new Error("캐릭터를 찾을 수 없습니다.");

            fights = [];
            character.recentReports.data.forEach(r => {
                const actors = r.masterData.actors;
                r.fights.forEach(f => {
                    // 필터를 아예 제거: Trash든 Multiple든 일단 다 담습니다.
                    let info = { name: f.name, cat: "기타" };
                    for (const b of bossDB) {
                        if (f.name.includes(b.key)) { info = b; break; }
                    }
                    if (f.name.includes("Trash")) info.cat = "기타";

                    fights.push({ 
                        ...f, 
                        reportCode: r.code, 
                        actors: actors, 
                        korName: info.name, 
                        category: info.cat 
                    });
                });
            });

            render(document.getElementById('category-select').value);
        } catch (e) {
            content.innerHTML = `<div class="status-msg" style="color:var(--wipe);">${e.message}</div>`;
        }
    }

    function render(cat) {
        const container = document.getElementById('main-content');
        // '전체' 카테고리인 경우 모든 기록을 보여줍니다.
        const list = cat === "전체" ? fights : fights.filter(f => f.category === cat);
        
        // 최신 리포트 순으로 정렬 (리포트 코드 및 fight ID 기준)
        list.sort((a, b) => b.id - a.id);

        if(list.length === 0) {
            container.innerHTML = `<div class="status-msg">표시할 데이터가 없습니다. (전체 탭을 확인해 보세요)</div>`;
            return;
        }

        container.innerHTML = list.map(f => {
            const rawPercent = f.fightPercentage / 100;
            const displayPercent = f.kill ? "CLEAR" : (rawPercent === 0 ? "0.1" : rawPercent.toFixed(1)) + "%";
            
            const party = f.friendlyPlayers.map(pId => {
                const p = f.actors.find(a => a.id === pId);
                if(!p || p.name === "Limit Break") return '';
                const charLink = `https://ko.fflogs.com/character/kr/${currentServer}/${encodeURIComponent(p.name)}`;
                
                return `
                    <a href="${charLink}" target="_blank" class="player-link">
                        <div class="player-item">
                            <img src="https://assets.rpglogs.com/img/ff/icons/${p.icon}.png" class="job-icon" onerror="this.src='https://assets.rpglogs.com/img/ff/icons/Unknown.png'">
                            <div style="color:var(--sub)">${p.name.split(' ')[0]}</div>
                        </div>
                    </a>`;
            }).join('');

            return `
                <div class="log-card ${f.kill ? 'is-clear' : 'is-wipe'}">
                    <div class="log-header">
                        <b>${f.korName}</b>
                        <span style="font-weight:bold; color:${f.kill ? 'var(--clear)' : 'var(--wipe)'}">${displayPercent}</span>
                    </div>
                    <div style="padding:15px;">
                        <div class="party-grid">${party}</div>
                        <div class="link-group">
                            <span style="color:#555">CODE: ${f.reportCode}</span>
                            <div class="external-links">
                                <a href="https://ko.fflogs.com/reports/${f.reportCode}#fight=${f.id}" target="_blank" class="ext-link report-link">LOGS ↗</a>
                                <a href="https://xivanalysis.com/fflogs/${f.reportCode}/${f.id}" target="_blank" class="ext-link analysis-link">ANALYSIS ↗</a>
                            </div>
                        </div>
                    </div>
                </div>`;
        }).join('');
    }
</script>
</body>
</html>
