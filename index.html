<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Tomestone - Minimal Log</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --clear: #10b981; --wipe: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* 레이드 그룹 타이틀 */
        .raid-group-header { border-bottom: 2px solid var(--primary); margin: 30px 0 15px 0; padding-bottom: 8px; font-size: 18px; font-weight: bold; color: var(--primary); }
        
        /* 단일 로그 카드 (심플 버전) */
        .log-card { background: #000; border-radius: 10px; border: 1px solid #333; margin-bottom: 12px; transition: 0.2s; }
        .log-card:hover { border-color: var(--primary); }
        .log-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #111; }
        
        .status-badge { padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; min-width: 60px; text-align: center; }
        .status-clear { background: var(--clear); color: white; }
        .status-wipe { background: var(--wipe); color: white; }
        
        .log-body { padding: 12px 15px; }
        .party-summary { font-size: 13px; color: var(--sub); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .party-summary b { color: var(--text); }

        /* 입력 폼 */
        .gear-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input { background: #111; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; flex: 1; }
        
        button { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-save { background: #2d3748; color: var(--sub); }
        .btn-save:hover { background: var(--primary); color: white; }
        
        .btn-link { background: none; color: var(--primary); padding: 0; text-decoration: none; font-size: 12px; }
        .btn-link:hover { text-decoration: underline; }

        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: none; border: 1px solid var(--border); color: var(--sub); cursor: pointer; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="location.reload()">데이터 동기화</button>
        <button class="tab-btn" onclick="toggleSettings()">설정</button>
    </div>

    <div id="section-settings" class="card" style="display: none;">
        <h3>⚙️ 설정</h3>
        <input type="text" id="client-id" placeholder="Client ID" style="width:100%; margin-bottom:10px;">
        <input type="password" id="client-secret" placeholder="Client Secret" style="width:100%; margin-bottom:10px;">
        <input type="text" id="char-name" placeholder="캐릭터 이름" style="width:100%; margin-bottom:10px;">
        <select id="char-server" style="background:#000; color:white; width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid var(--border);">
            <option value="Carbuncle">카벙클</option>
            <option value="Chocobo">초코보</option>
            <option value="Moogle">모그리</option>
            <option value="Tonberry">톤베리</option>
            <option value="Fenrir">펜리르</option>
        </select>
        <button style="background:var(--primary); color:white; width:100%;" onclick="saveSettings()">저장</button>
    </div>

    <div id="main-content">
        <p style="text-align:center; color:var(--sub); margin-top:50px;">FFLogs 데이터를 분석 중입니다...</p>
    </div>
</div>

<script>
    window.onload = function() {
        const saved = JSON.parse(localStorage.getItem('tomestone_cfg'));
        if(!saved) { toggleSettings(); document.getElementById('main-content').innerHTML = ''; }
        else { fetchData(saved); }
    };

    function toggleSettings() {
        const s = document.getElementById('section-settings');
        s.style.display = s.style.display === 'none' ? 'block' : 'none';
    }

    function saveSettings() {
        const cfg = {
            id: document.getElementById('client-id').value.trim(),
            secret: document.getElementById('client-secret').value.trim(),
            name: document.getElementById('char-name').value.trim(),
            server: document.getElementById('char-server').value
        };
        localStorage.setItem('tomestone_cfg', JSON.stringify(cfg));
        location.reload();
    }

    async function fetchData(saved) {
        try {
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${saved.id}&client_secret=${saved.secret}`
            });
            const tokenData = await tokenRes.json();
            const token = tokenData.access_token;

            const query = `query {
                characterData {
                    character(name: "${saved.name}", serverSlug: "${saved.server}", serverRegion: "KR") {
                        recentReports(limit: 20) {
                            data {
                                code
                                title
                                fights { kill }
                                masterData { actors(type: "Player") { name } }
                            }
                        }
                    }
                }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const result = await res.json();
            renderLogs(result.data.characterData.character.recentReports.data, saved.name);
        } catch (e) {
            document.getElementById('main-content').innerHTML = `<p style='color:red;'>오류: ${e.message}</p>`;
        }
    }

    function renderLogs(reports, myName) {
        const container = document.getElementById('main-content');
        container.innerHTML = "";

        const grouped = {};
        reports.forEach(r => {
            if (!grouped[r.title]) grouped[r.title] = [];
            grouped[r.title].push(r);
        });

        for (const title in grouped) {
            const groupSection = document.createElement('div');
            groupSection.innerHTML = `<div class="raid-group-header">${title}</div>`;
            
            grouped[title].forEach(report => {
                const kills = report.fights.filter(f => f.kill).length;
                const wipes = report.fights.filter(f => !f.kill).length;
                const isClear = kills > 0;
                const reportCode = report.code;
                
                // 파티원 요약 처리 (8인 고정 메시지)
                const actors = report.masterData.actors;
                const partySummary = actors.length >= 8 
                    ? `<b>${myName}</b> 외 ${actors.length - 1}인 (8인 파티)` 
                    : `<b>${myName}</b> 포함 ${actors.length}인 참여`;

                const savedData = JSON.parse(localStorage.getItem('gear_' + reportCode)) || {w:'', m:''};

                groupSection.innerHTML += `
                    <div class="log-card">
                        <div class="log-header">
                            <span class="status-badge ${isClear ? 'status-clear' : 'status-wipe'}">
                                ${isClear ? '클리어' : '리트'}
                            </span>
                            <span style="font-size:12px; color:var(--sub); font-family:monospace;">${reportCode}</span>
                            <span style="font-size:12px; font-weight:bold; color:var(--sub);">${wipes}회 트라이</span>
                        </div>
                        <div class="log-body">
                            <div class="party-summary">👤 ${partySummary}</div>
                            <div class="gear-row">
                                <input type="text" id="w-${reportCode}" value="${savedData.w}" placeholder="사용한 무기 명칭">
                                <input type="text" id="m-${reportCode}" value="${savedData.m}" placeholder="마테리아 세팅 메모">
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <a href="https://ko.fflogs.com/reports/${reportCode}" target="_blank" class="btn-link">리포트 상세 보기 ↗</a>
                                <button class="btn-save" onclick="saveGear('${reportCode}')">정보 저장</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.appendChild(groupSection);
        }
    }

    function saveGear(code) {
        localStorage.setItem('gear_' + code, JSON.stringify({
            w: document.getElementById('w-' + code).value,
            m: document.getElementById('m-' + code).value
        }));
        alert("메모가 저장되었습니다.");
    }
</script>

</body>
</html>
