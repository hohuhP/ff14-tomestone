<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV KR PRO LOGS</title>
    <style>
        :root { 
            --bg: #0a0a0c; --card: #16161a; --panel: #1f1f23;
            --primary: #c084fc; --accent: #22c55e; --text: #f3f4f6; --sub: #9ca3af;
            --rank-gold: #ffb100; --rank-pink: #e268a8; --rank-orange: #ff8000; --rank-purple: #a335ee;
            --rank-blue: #0070ff; --rank-green: #1eff00; --rank-grey: #666;
            --tank: #2d70ff; --healer: #33a833; --dps: #e03131;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; }
        .wrapper { max-width: 1200px; margin: 0 auto; }

        .allstar-header { 
            display: none; position: sticky; top: 0; z-index: 100;
            background: rgba(22, 22, 26, 0.95); backdrop-filter: blur(15px);
            padding: 20px 30px; border-radius: 20px; border-bottom: 2px solid var(--primary);
            margin-bottom: 25px; align-items: center; justify-content: space-between;
        }
        .allstar-badge { font-size: 36px; font-weight: 900; padding: 8px 20px; border-radius: 15px; color: #fff; margin-right: 15px; min-width: 80px; text-align: center; }

        .config-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #2d2d33; margin-bottom: 30px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; margin-bottom: 15px; }
        input, select { background: #000; border: 1px solid #3f3f46; color: #fff; padding: 14px; border-radius: 10px; }
        .btn { background: var(--primary); color: #000; border: none; padding: 14px 28px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }

        .tab-menu { display: none; gap: 8px; background: #1a1a1e; padding: 6px; border-radius: 12px; margin-bottom: 20px; width: fit-content; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px; color: var(--sub); font-weight: 600; }
        .tab.active { background: #2d2d33; color: var(--primary); }

        #fight-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .fight-item { background: var(--panel); border: 1px solid #2d2d33; padding: 22px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .fight-item:hover { border-color: var(--primary); transform: translateY(-3px); }

        #party-container { display: none; margin-top: 40px; padding: 30px; background: var(--card); border-radius: 24px; border: 1px solid var(--primary); }
        .party-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 20px; }
        .player-card { background: #111; padding: 16px; border-radius: 14px; display: flex; align-items: center; gap: 12px; border-left: 5px solid #444; }
        .job-icon { width: 32px; height: 32px; }
        .p-name { font-weight: 700; font-size: 15px; }
        .p-rank { font-weight: 900; font-size: 14px; margin-left: auto; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="top-user-bar" class="allstar-header">
        <div style="display: flex; align-items: center;">
            <div id="as-pct" class="allstar-badge">--</div>
            <div>
                <div id="as-name" style="font-size: 24px; font-weight: 900;">PLAYER</div>
                <div id="as-server" style="font-size: 14px; color: var(--sub);">SERVER</div>
            </div>
        </div>
        <div style="text-align: right">
            <div style="font-size: 12px; color: var(--sub); font-weight: 800;">ALL-STAR POINTS</div>
            <div id="as-points" style="font-size: 32px; font-weight: 900; color: var(--primary);">0</div>
        </div>
    </div>

    <div class="config-card">
        <div class="input-group">
            <input type="text" id="cid" placeholder="Client ID">
            <input type="password" id="csec" placeholder="Client Secret">
            <button class="btn" onclick="auth()">인증하기</button>
        </div>
        <div class="input-group" style="grid-template-columns: 80px 1fr 1fr auto;">
            <input type="text" value="KR" readonly style="text-align: center;">
            <select id="sv-select">
                <option value="Fenrir">펜리르</option><option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option><option value="Carbuncle">카벙클</option>
                <option value="Tonberry">톤베리</option>
            </select>
            <input type="text" id="cnick" placeholder="닉네임">
            <button id="search-btn" class="btn" style="background: var(--accent)" onclick="fetchCharacter()" disabled>불러오기</button>
        </div>
    </div>

    <div id="tab-nav" class="tab-menu">
        <div class="tab active" onclick="renderFights('all', this)">전체</div>
        <div class="tab" onclick="renderFights('ultimate', this)">절</div>
        <div class="tab" onclick="renderFights('savage', this)">영웅</div>
        <div class="tab" onclick="renderFights('extreme', this)">극</div>
        <div class="tab" onclick="renderFights('other', this)">기타</div>
    </div>
    <div id="fight-list"></div>

    <div id="party-container">
        <h2 id="party-title" style="margin:0; color:var(--primary)">파티원 상세 정보</h2>
        <div id="party-list" class="party-grid"></div>
    </div>
</div>

<script>
    let reports = [], authToken = "";

    const translateMap = {
        "Oracle of Darkness": "또 하나의 미래",
        "Usurper of Frost": "또 하나의 미래",
        "Lindwurm": "린드블룸",
        "The Tyrant": "더 타이런트", 
        "Vamp Fatale": "뱀프 파탈",
        "Red Hot": "레드 핫", 
        "Deep Blue": "딥블루",
        "The Unending Coil of Bahamut": "절 바하무트 탄생전",
        "The Weapon's Refrain": "절 알테마 파괴작전",
        "The Epic of Alexander": "절 알렉산더 공성전",
        "Dragonsong's Reprise": "절 용시전쟁",
        "The Omega Protocol": "절 오메가 검증전"
    };

    const jobColors = {
        "Paladin": "var(--tank)", "Warrior": "var(--tank)", "DarkKnight": "var(--tank)", "Gunbreaker": "var(--tank)",
        "WhiteMage": "var(--healer)", "Scholar": "var(--healer)", "Astrologian": "var(--healer)", "Sage": "var(--healer)",
        "Monk": "var(--dps)", "Dragoon": "var(--dps)", "Ninja": "var(--dps)", "Samurai": "var(--dps)", "Reaper": "var(--dps)", "Viper": "var(--dps)",
        "Bard": "var(--dps)", "Machinist": "var(--dps)", "Dancer": "var(--dps)",
        "BlackMage": "var(--dps)", "Summoner": "var(--dps)", "RedMage": "var(--dps)", "Pictomancer": "var(--dps)"
    };

    const getT = (s) => {
        if(s.includes("Oracle") || s.includes("Usurper")) return "또 하나의 미래";
        let r = s;
        for(let k in translateMap) r = r.replace(new RegExp(k, 'g'), translateMap[k]);
        return r;
    };
    const getC = (p) => p>=99?'var(--rank-pink)':p>=95?'var(--rank-orange)':p>=75?'var(--rank-purple)':p>=50?'var(--rank-blue)':p>=25?'var(--rank-green)':'var(--rank-grey)';

    async function auth() {
        const id = document.getElementById('cid').value;
        const sec = document.getElementById('csec').value;
        try {
            const res = await fetch("https://www.fflogs.com/oauth/token", {
                method: "POST", headers: { "Authorization": "Basic " + btoa(id + ":" + sec), "Content-Type": "application/x-www-form-urlencoded" },
                body: "grant_type=client_credentials"
            });
            const d = await res.json();
            if(d.access_token) { authToken = d.access_token; alert("인증 성공!"); document.getElementById('search-btn').disabled = false; }
        } catch(e) { alert("인증 실패"); }
    }

    async function fetchCharacter() {
        const name = document.getElementById('cnick').value;
        const server = document.getElementById('sv-select').value;
        const q = `query { 
            characterData { 
                character(name: "${name}", serverSlug: "${server}", serverRegion: "KR") { 
                    name zoneRankings(zoneID: -1) 
                    recentReports(limit: 50) { data { code fights(killType: Kills) { id name difficulty } } } 
                } 
            } 
        }`;
        const res = await fetch("https://www.fflogs.com/api/v2/client", {
            method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
            body: JSON.stringify({ query: q })
        });
        const json = await res.json();
        const char = json.data?.characterData?.character;
        if(!char) return alert("캐릭터를 찾을 수 없습니다.");

        // 올스타 점수 데이터 보정
        const zr = char.zoneRankings || {};
        const score = zr.rankPoints || zr.allstarPoints || 0;
        const pct = zr.rankPercent || 0;

        document.getElementById('top-user-bar').style.display = 'flex';
        document.getElementById('as-pct').innerText = pct.toFixed(1);
        document.getElementById('as-pct').style.background = getC(pct);
        document.getElementById('as-name').innerText = char.name;
        document.getElementById('as-server').innerText = server;
        document.getElementById('as-points').innerText = Math.floor(score).toLocaleString();

        reports = char.recentReports.data;
        document.getElementById('tab-nav').style.display = 'flex';
        renderFights('all', document.querySelector('.tab'));
    }

    function renderFights(type, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        let html = "";
        const sorted = [];
        reports.forEach(r => r.fights?.forEach(f => sorted.push({ ...f, code: r.code })));
        
        // 절 > 영웅 > 극 > 기타 순서 정렬 (난이도 ID 기반)
        const diffOrder = { 5: 1, 101: 2, 4: 3 }; 
        sorted.sort((a, b) => (diffOrder[a.difficulty] || 99) - (diffOrder[b.difficulty] || 99));

        sorted.forEach(f => {
            const isUlt = f.difficulty === 5;
            const isSav = f.difficulty === 101 || f.difficulty === 10;
            const isExt = f.difficulty === 4;
            const isOther = !isUlt && !isSav && !isExt;

            let show = (type === 'all') || (type === 'ultimate' && isUlt) || (type === 'savage' && isSav) || (type === 'extreme' && isExt) || (type === 'other' && isOther);

            if(show) {
                html += `<div class="fight-item" onclick="viewParty('${f.code}', ${f.id}, '${getT(f.name)}')">
                    <div style="font-weight: 900; font-size: 17px; color: var(--primary)">${getT(f.name)}</div>
                    <div style="color: var(--sub); font-size: 12px; margin-top: 6px;">리포트: ${f.code} | ${isUlt?'절':isSav?'영웅':isExt?'극':'기타'}</div>
                </div>`;
            }
        });
        document.getElementById('fight-list').innerHTML = html || "<div style='color:var(--sub); padding:20px;'>데이터가 없습니다.</div>";
    }

    async function viewParty(code, fid, title) {
        const container = document.getElementById('party-container');
        const list = document.getElementById('party-list');
        container.style.display = 'block';
        list.innerHTML = "파티원 정보를 로드하고 있습니다...";
        
        const q = `query { reportData { report(code: "${code}") { 
            rankings(fightIDs: [${fid}]) 
            table(fightIDs: [${fid}], dataType: Summary) 
        } } }`;

        try {
            const res = await fetch("https://www.fflogs.com/api/v2/client", {
                method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
                body: JSON.stringify({ query: q })
            });
            const json = await res.json();
            const report = json.data.reportData.report;
            const details = report.table.data.playerDetails;
            const rankings = report.rankings.data[0]?.rankings || [];

            let h = "";
            const allPlayers = [...(details.tanks || []), ...(details.healers || []), ...(details.dps || [])];
            
            allPlayers.forEach(p => {
                const color = jobColors[p.type] || "#ccc";
                const rankObj = rankings.find(r => r.name === p.name) || { percentile: 0 };
                h += `<div class="player-card" style="border-left-color: ${color}">
                    <img class="job-icon" src="https://xivapi.com/cj/1/${p.type.toLowerCase()}.png">
                    <div class="p-name" style="color:${color}">${p.name}</div>
                    <div class="p-rank" style="color:${getC(rankObj.percentile)}">${rankObj.percentile.toFixed(1)}%</div>
                </div>`;
            });
            list.innerHTML = h;
            document.getElementById('party-title').innerText = `[${title}] 함께한 파티원`;
            window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
        } catch(e) { list.innerHTML = "<span style='color:#ff4d4d'>데이터 로드 오류. 다시 시도해 주세요.</span>"; }
    }
</script>
</body>
</html>
