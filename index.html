<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV KR PRO LOGS</title>
    <style>
        :root { 
            --bg: #0a0a0c; --card: #16161a; --panel: #1f1f23;
            --primary: #c084fc; --accent: #22c55e; --text: #f3f4f6; --sub: #9ca3af;
            --tank: #2d70ff; --healer: #33a833; --dps: #e03131;
            --rank-gold: #ffb100; --rank-pink: #e268a8; --rank-orange: #ff8000; --rank-purple: #a335ee;
            --rank-blue: #0070ff; --rank-green: #1eff00; --rank-grey: #666;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .wrapper { max-width: 1400px; margin: 0 auto; }

        /* 상단 유저 헤더 */
        .allstar-header { 
            display: none; position: sticky; top: 0; z-index: 100;
            background: rgba(22, 22, 26, 0.95); backdrop-filter: blur(15px);
            padding: 25px 35px; border-radius: 20px; border-bottom: 2px solid var(--primary);
            margin-bottom: 25px; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .allstar-badge { font-size: 38px; font-weight: 900; padding: 10px 25px; border-radius: 18px; color: #fff; margin-right: 20px; min-width: 90px; text-align: center; }

        .btn { background: var(--primary); color: #000; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: wait; }

        input, select { background: #000; border: 1px solid #3f3f46; color: #fff; padding: 14px; border-radius: 10px; }
        .search-bar { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid var(--primary); background: #0a0a0c; color: #fff; font-size: 16px; margin-bottom: 25px; box-sizing: border-box; }

        .tab-menu { display: none; gap: 10px; background: #1a1a1e; padding: 8px; border-radius: 15px; margin-bottom: 25px; width: fit-content; }
        .tab { padding: 12px 24px; cursor: pointer; border-radius: 10px; color: var(--sub); font-weight: 600; transition: 0.2s; }
        .tab.active { background: #2d2d33; color: var(--primary); }

        /* 전투 리스트 디자인 (폴더형) */
        #fight-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-bottom: 40px; align-items: start; }
        .fight-folder { background: var(--panel); border: 1px solid #2d2d33; border-radius: 20px; overflow: hidden; transition: 0.2s; }
        .fight-folder:hover { border-color: var(--primary); }
        .folder-header { padding: 22px; cursor: pointer; position: relative; }
        .folder-content { background: #0a0a0c; padding: 15px; border-top: 1px solid #2d2d33; display: flex; flex-direction: column; gap: 12px; }
        
        .sub-fight-item { background: #16161a; border: 1px solid #333; padding: 15px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .sub-fight-item:hover { border-color: var(--primary); background: #1f1f23; }

        /* 하단 2분할 패널 레이아웃 (image_566233.png의 핵심) */
        .inline-party-container { 
            grid-column: 1 / -1; background: var(--card); border: 1.5px solid var(--primary); 
            border-radius: 24px; padding: 35px; display: flex; gap: 30px; flex-wrap: wrap; 
            margin-top: 10px; animation: slideDown 0.3s ease; box-shadow: 0 15px 50px rgba(0,0,0,0.7);
        }
        .party-side { flex: 1; min-width: 400px; }
        .gear-side { flex: 1.2; min-width: 500px; background: #111; padding: 30px; border-radius: 20px; border-left: 6px solid var(--primary); }
        
        .player-card { 
            background: #16161a; padding: 18px; border-radius: 15px; display: flex; align-items: center; gap: 15px; 
            border-left: 6px solid #444; cursor: pointer; margin-bottom: 12px; transition: 0.2s;
        }
        .player-card:hover { background: #1f1f2e; transform: translateX(5px); }

        .gear-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .gear-card { 
            background: var(--panel); border: 1px solid #2d2d33; padding: 15px; border-radius: 15px; 
            display: flex; align-items: center; gap: 15px; transition: 0.2s; height: 75px; 
        }
        .gear-card.editable { cursor: pointer; border-color: var(--primary); }
        .item-thumb { width: 52px; height: 52px; border-radius: 10px; background: #000; flex-shrink: 0; }
        
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; backdrop-filter: blur(5px); }
        .modal-body { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #16161a; border-radius: 24px; z-index: 1000; padding: 35px; border: 1px solid #333; max-width: 550px; width: 90%; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 상단 헤더 복구 -->
    <div id="top-user-bar" class="allstar-header">
        <div style="display: flex; align-items: center;">
            <div id="as-pct" class="allstar-badge">--</div>
            <div>
                <div id="as-name" style="font-size: 28px; font-weight: 900; color: #fff;">캐릭터명</div>
                <div id="as-server" style="font-size: 16px; color: var(--sub);">서버명</div>
            </div>
        </div>
        <div style="text-align: right">
            <div style="font-size: 12px; color: var(--sub); font-weight: 800; letter-spacing: 1px;">BEST RANK (최고 순위)</div>
            <div id="rank-display" style="font-size: 32px; font-weight: 900; color: var(--primary); margin-top: 5px;">순위 미집계</div>
            <button class="btn" style="background: #2d2d33; color: #fff; padding: 10px 20px; font-size: 13px; margin-top:15px;" onclick="openConfig()">⚙️ 설정 변경</button>
        </div>
    </div>

    <input type="text" id="filter-input" class="search-bar" style="display: none;" placeholder="🔍 보스 이름, 파티원 닉네임 검색..." onkeyup="filterLogs()">
    
    <div id="tab-nav" class="tab-menu">
        <div class="tab active" onclick="renderFights('all', this)">전체 기록</div>
        <div class="tab" onclick="renderFights('ultimate', this)">절 레이드</div>
        <div class="tab" onclick="renderFights('savage', this)">영웅 난이도</div>
        <div class="tab" onclick="renderFights('other', this)">기타</div>
    </div>
    
    <div id="fight-list"></div>
</div>

<!-- 설정 모달 -->
<div id="config-bg" class="modal-bg" style="display:block;" onclick="closeConfig()"></div>
<div id="config-ui" class="modal-body" style="display:block;">
    <h2 style="margin-top: 0; color: var(--primary); margin-bottom: 25px;">⚙️ FFlogs 연동 설정</h2>
    <div style="margin-bottom: 25px; display: flex; flex-direction: column; gap: 15px;">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="cid" placeholder="Client ID" style="flex:1;">
            <input type="password" id="csec" placeholder="Client Secret" style="flex:1;">
        </div>
        <button class="btn" onclick="auth()">1. API 인증하기</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 15px;">
        <div style="display: flex; gap: 10px;">
            <select id="sv-select" style="flex:0.8;">
                <option value="Carbuncle">카벙클</option><option value="Chocobo">초코보</option>
                <option value="Moogle">모그리</option><option value="Tonberry" selected>톤베리</option><option value="Fenrir">펜리르</option>
            </select>
            <input type="text" id="cnick" placeholder="닉네임" style="flex:1.2;">
        </div>
        <button id="search-btn" class="btn" style="background: var(--accent)" onclick="fetchCharacter()" disabled>2. 로그 불러오기</button>
    </div>
</div>

<!-- 아이템 검색 모달 -->
<div id="m-bg" class="modal-bg" onclick="closeM()"></div>
<div id="m-ui" class="modal-body">
    <h3 style="margin-top:0; color: var(--primary);">아이템 검색 <small id="db-status" style="color:var(--sub); font-size:11px;"></small></h3>
    <input type="text" id="m-search" placeholder="아이템 이름을 입력하세요..." oninput="doSearch(this.value)" style="width: 100%; box-sizing: border-box;">
    <div id="m-results" style="max-height: 400px; overflow-y: auto; margin-top: 20px;"></div>
</div>

<script>
    let reports = [], authToken = "";
    let itemDB = [], itemMap = new Map(), dbLoaded = false, isDbLoading = false;
    let gState = [], editMode = false, curActiveGearId = "", curIdx = { s: null };
    let editedGearCache = {}, dataCache = {};

    const translateMap = {
        "Fatebreaker": "절 또 하나의 미래", "Oracle": "절 또 하나의 미래", "Usurper": "절 또 하나의 미래",
        "Enuo": "에누오", "Doomtrain": "마열차", "Lindwurm": "린드블룸",
        "The Tyrant": "더 타이런트", "Vamp Fatale": "뱀프 파탈", "Red Hot": "레드 핫", "Deep Blue": "딥블루",
        "The Unending Coil of Bahamut": "절 바하무트 토벌전", "The Weapon's Refrain": "절 알테마 파괴작전",
        "The Epic of Alexander": "절 알렉산더 토벌전", "Dragonsong's Reprise": "절 용시전쟁", "The Omega Protocol": "절 오메가 검증전"
    };

    const emptyIcons = ["060101", "060102", "060103", "060104", "060105", "060107", "060108", "060109", "060110", "060111", "060112", "060112"];

    function getT(s) {
        if (!s) return "";
        let r = s;
        for (let k in translateMap) { if (r.includes(k)) r = r.split(k).join(translateMap[k]); }
        return r.replace(" (Ultimate)", "").replace(" (Savage)", "").replace(" (Extreme)", "");
    }

    function getIconUrl(iconId) {
        if (!iconId || iconId === "0") return "https://assets.rpglogs.com/img/ff/icons/Unknown.png";
        const idStr = String(iconId).padStart(6, '0');
        return `https://xivapi.com/i/${idStr.substring(0, 3)}000/${idStr}.png`;
    }

    // 💡 렉 방지 점진적 로딩
    async function loadItemDB() {
        if (dbLoaded || isDbLoading) return;
        isDbLoading = true;
        const statusEl = document.getElementById('db-status');
        try {
            const res = await fetch("https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv");
            const raw = await res.text();
            const lines = raw.split('\n').slice(3);
            const CHUNK = 4000;
            for (let i = 0; i < lines.length; i += CHUNK) {
                const slice = lines.slice(i, i + CHUNK);
                slice.forEach(l => {
                    const c = l.split(',');
                    if (c.length >= 13 && c[1]) {
                        const item = { id: c[0], name: c[1].replace(/"/g,''), icon: c[2].padStart(6,'0'), ilvl: c[12] };
                        itemDB.push(item);
                        itemMap.set(item.id, item);
                    }
                });
                if(statusEl) statusEl.innerText = `(${Math.floor((i/lines.length)*100)}% 완료)`;
                await new Promise(r => setTimeout(r, 0));
            }
            dbLoaded = true;
            if(statusEl) statusEl.innerText = "(로딩 완료)";
        } catch (e) { if(statusEl) statusEl.innerText = "(로드 실패)"; } finally { isDbLoading = false; }
    }

    async function auth() {
        const id = document.getElementById('cid').value.trim(), sec = document.getElementById('csec').value.trim();
        try {
            const res = await fetch("https://www.fflogs.com/oauth/token", {
                method: "POST", headers: { "Authorization": "Basic " + btoa(id + ":" + sec), "Content-Type": "application/x-www-form-urlencoded" },
                body: "grant_type=client_credentials"
            });
            const d = await res.json();
            if(d.access_token) { authToken = d.access_token; alert("API 인증 성공!"); document.getElementById('search-btn').disabled = false; loadItemDB(); }
        } catch(e) { alert("인증 정보를 확인하세요."); }
    }

    async function fetchCharacter() {
        const name = document.getElementById('cnick').value.trim(), server = document.getElementById('sv-select').value;
        const btn = document.getElementById('search-btn');
        btn.innerText = "로딩 중..."; btn.disabled = true;
        const q = `query { characterData { character(name: "${name}", serverSlug: "${server}", serverRegion: "KR") { name zoneRankings recentReports(limit: 15) { data { code title fights { id name difficulty kill friendlyPlayers startTime endTime lastPhase } masterData { actors(type: "Player") { id name subType } } } } } } }`;
        try {
            const res = await fetch("https://www.fflogs.com/api/v2/client", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` }, body: JSON.stringify({ query: q }) });
            const json = await res.json();
            const char = json.data?.characterData?.character;
            if(!char) return alert("캐릭터를 찾을 수 없습니다.");
            
            document.getElementById('top-user-bar').style.display = 'flex';
            document.getElementById('as-name').innerText = char.name;
            document.getElementById('as-server').innerText = server;
            document.getElementById('filter-input').style.display = 'block';
            document.getElementById('tab-nav').style.display = 'flex';
            
            const zr = char.zoneRankings || {};
            const pct = zr.bestPerformanceAverage || 0;
            document.getElementById('as-pct').innerText = pct.toFixed(1);
            document.getElementById('as-pct').style.background = pct >= 95 ? '#ff8000' : '#a335ee';

            reports = char.recentReports.data;
            renderFights('all', document.querySelector('.tab'));
            closeConfig();
        } catch(e) { alert("오류 발생"); } finally { btn.innerText = "불러오기"; btn.disabled = false; }
    }

    function renderFights(type, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        const list = document.getElementById('fight-list');
        let html = "";
        
        const groups = {};
        reports.forEach(r => {
            r.fights.forEach(f => {
                const key = `${r.code}_${f.name}`;
                if(!groups[key]) groups[key] = { code: r.code, name: f.name, fights: [], actors: r.masterData.actors };
                groups[key].fights.push(f);
            });
        });

        Object.values(groups).forEach(g => {
            const isUlt = /Ultimate|절|Fatebreaker|Oracle|Usurper/i.test(g.name);
            const isSav = !isUlt && /Savage|영웅/i.test(g.name);
            if (type === 'ultimate' && !isUlt) return;
            if (type === 'savage' && !isSav) return;
            if (type === 'other' && (isUlt || isSav)) return;

            const players = g.actors.map(a => a.name).join(",");
            const folderId = `folder_${g.code}_${g.fights[0].id}`;

            html += `<div class="fight-folder" data-players="${players}">
                <div class="folder-header" onclick="toggleFolder('${folderId}')">
                    <div style="font-weight:900; font-size:20px; color:var(--primary)">${getT(g.name)}</div>
                    <div style="font-size:12px; color:var(--sub); margin-top:5px;">${g.code} | ${g.fights.length}개의 기록</div>
                </div>
                <div class="folder-content" id="${folderId}" style="display:none;">`;
            
            g.fights.forEach(f => {
                let killText = f.kill ? "<span style='color:var(--accent);'>클리어</span>" : `<span style='color:var(--dps);'>트라이 (P${f.lastPhase || '?'})</span>`;
                html += `<div class="sub-fight-item" onclick="viewParty('${g.code}', ${f.id}, '${getT(g.name)}', this.parentElement.parentElement)">
                    <div style="font-size:14px; color:#fff;">ID: ${f.id} | ${killText}</div>
                    <div style="color:var(--primary); font-weight:bold; font-size:13px;">파티 보기 ▶</div>
                </div>`;
            });
            html += `</div></div>`;
        });
        list.innerHTML = html;
    }

    function toggleFolder(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    }

    async function viewParty(code, fid, title, el) {
        const cacheKey = `${code}-${fid}`;
        if(document.getElementById(`inline-${cacheKey}`)) { document.getElementById(`inline-${cacheKey}`).remove(); return; }
        document.querySelectorAll('.inline-party-container').forEach(e => e.remove());

        const container = document.createElement('div');
        container.id = `inline-${cacheKey}`;
        container.className = 'inline-party-container';
        container.innerHTML = `
            <div class="party-side">
                <h3 style="margin-top:0; color:var(--primary); font-size:22px;">[${title}] 전투 참여자 <small style="font-size:12px; color:var(--sub);">(ESC로 닫기)</small></h3>
                <div id="list-${cacheKey}" class="party-grid">데이터 로드 중...</div>
            </div>
            <div class="gear-side">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3 id="gear-title-${cacheKey}" style="margin:0; color:var(--primary); font-size:22px;">장비 정보</h3>
                    <button id="mode-btn-${cacheKey}" class="btn" style="display:none; padding: 10px 18px; background:var(--accent); font-size:13px;" onclick="toggleMode()">장비 검색/편집 모드</button>
                </div>
                <div id="gear-grid-${cacheKey}" class="gear-grid"></div>
            </div>`;
        el.parentNode.insertBefore(container, el.nextSibling);

        if(!dataCache[cacheKey]) {
            const res = await fetch("https://www.fflogs.com/api/v2/client", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` }, body: JSON.stringify({ query: `query { reportData { report(code: "${code}") { table(fightIDs: [${fid}], dataType: Summary) } } }` }) });
            dataCache[cacheKey] = (await res.json()).data.reportData.report;
        }
        
        const report = reports.find(r => r.code === code);
        const party = report.masterData.actors.filter(a => report.fights.find(f => f.id === fid).friendlyPlayers.includes(a.id));
        document.getElementById(`list-${cacheKey}`).innerHTML = party.map(p => `<div class="player-card" onclick="openGear('${cacheKey}', '${p.name}')">${p.name}</div>`).join('');
        openGear(cacheKey, document.getElementById('as-name').innerText);
    }

    async function openGear(cacheKey, pName) {
        if(!dbLoaded) await loadItemDB();
        curActiveGearId = cacheKey; editMode = false;
        const isMe = pName === document.getElementById('as-name').innerText;
        const details = dataCache[cacheKey].table.data.playerDetails;
        const player = [...(details.tanks || []), ...(details.healers || []), ...(details.dps || [])].find(p => p.name === pName);

        const gearKey = `${cacheKey}_${pName}`;
        if (editedGearCache[gearKey]) gState = JSON.parse(JSON.stringify(editedGearCache[gearKey]));
        else if (player && player.gear) gState = player.gear.map(g => ({ id: String(g.id) }));
        else gState = Array.from({length: 12}, () => ({ id: "0" }));

        document.getElementById(`mode-btn-${cacheKey}`).style.display = isMe ? "block" : "none";
        document.getElementById(`gear-title-${cacheKey}`).innerText = `${pName} 장비 | i000`;
        drawGear();
    }

    function drawGear() {
        const grid = document.getElementById(`gear-grid-${curActiveGearId}`);
        const labels = ["무기", "보조무기", "머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지1", "반지2"];
        grid.innerHTML = gState.map((g, i) => {
            const it = itemMap.get(g.id);
            const icon = it ? getIconUrl(it.icon) : getIconUrl(emptyIcons[i]);
            return `<div class="gear-card ${editMode ? 'editable' : ''}" onclick="${editMode ? `openSearch(${i})` : ''}">
                <img class="item-thumb" src="${icon}">
                <div style="flex:1;"><small style="color:var(--sub); font-weight:bold;">${labels[i]}</small><div style="font-weight:bold; font-size:15px; color:#fff;">${it ? it.name : "빈 슬롯 (클릭하여 설정)"}</div></div>
                <div style="color:var(--primary); font-weight:900;">-</div>
            </div>`;
        }).join('');
    }

    function toggleMode() { editMode = !editMode; drawGear(); }
    function openSearch(idx) { curIdx.s = idx; document.getElementById('m-bg').style.display = 'block'; document.getElementById('m-ui').style.display = 'block'; }
    function closeM() { document.getElementById('m-bg').style.display = 'none'; document.getElementById('m-ui').style.display = 'none'; }
    function openConfig() { document.getElementById('config-bg').style.display = 'block'; document.getElementById('config-ui').style.display = 'block'; }
    function closeConfig() { document.getElementById('config-bg').style.display = 'none'; document.getElementById('config-ui').style.display = 'none'; }
    function filterLogs() { const q = document.getElementById('filter-input').value.toLowerCase(); document.querySelectorAll('.fight-folder').forEach(el => el.style.display = (el.innerText.toLowerCase().includes(q) || el.getAttribute('data-players').toLowerCase().includes(q)) ? '' : 'none'); }
    function doSearch(v) { if(v.length < 2) return; const res = itemDB.filter(i => i.name.includes(v)).slice(0, 30); document.getElementById('m-results').innerHTML = res.map(i => `<div class="m-result-item" onclick="pick('${i.id}')"><img src="${getIconUrl(i.icon)}" width="36" style="border-radius:6px;"> <span style="font-weight:bold;">${i.name}</span></div>`).join(''); }
    function pick(id) { gState[curIdx.s].id = id; editedGearCache[`${curActiveGearId}_${document.getElementById('as-name').innerText}`] = JSON.parse(JSON.stringify(gState)); drawGear(); closeM(); }
    document.addEventListener('keydown', e => { if(e.key === 'Escape') { closeM(); closeConfig(); document.querySelectorAll('.inline-party-container').forEach(e => e.remove()); } });
</script>
</body>
</html>
