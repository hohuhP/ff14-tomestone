<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Tomestone - Live Sync</title>
    <style>
        /* 기본 디자인 (톰스톤 테마) */
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        input { background: #000; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; margin-bottom: 10px; width: calc(50% - 12px); }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .profile-header { display: flex; gap: 20px; align-items: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 10px; background: #333; object-fit: cover; }
        
        .raid-item { margin-top: 15px; padding: 15px; background: #000; border-radius: 8px; }
        .progress-bar { height: 10px; background: #333; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 1s; }
        
        .log-detail { font-size: 14px; color: var(--sub); line-height: 1.6; border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
        .gear-slot { display: inline-block; width: 45%; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. API 설정창 -->
    <div class="card" id="setup">
        <h3>🔗 FFLogs 실시간 연동 설정</h3>
        <input type="text" id="client-id" placeholder="Client ID 입력">
        <input type="password" id="client-secret" placeholder="Client Secret 입력">
        <input type="text" id="char-name" placeholder="캐릭터 이름">
        <input type="text" id="char-server" placeholder="서버명 (영어, 예: Chocobo)">
        <button onclick="fetchData()">데이터 불러오기 (실시간)</button>
    </div>

    <!-- 2. 캐릭터 프로필 (데이터 불러오기 성공 시 채워짐) -->
    <div class="card" style="display: none;" id="profile-section">
        <div class="profile-header">
            <img id="p-img" src="https://via.placeholder.com/100" class="profile-img" onclick="changePImg()">
            <div>
                <h2 id="p-name">캐릭터 이름</h2>
                <p id="p-server">서버 / 직업</p>
            </div>
        </div>
    </div>

    <!-- 3. 레이드 진행도 및 로그 상세 -->
    <div id="raid-section" style="display: none;">
        <div class="card">
            <h3>⚔️ 최근 레이드 성적 (공식 데이터)</h3>
            <div id="raid-list"></div>
        </div>
    </div>
</div>

<script>
    async function fetchData() {
        const clientId = document.getElementById('client-id').value;
        const clientSecret = document.getElementById('client-secret').value;
        const name = document.getElementById('char-name').value;
        const server = document.getElementById('char-server').value;

        if(!clientId || !clientSecret) return alert("API 키를 입력해주세요!");

        try {
            // 1. 액세스 토큰 받기
            const tokenRes = await fetch('https://www.fflogs.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `grant_type=client_credentials&client_id=${clientId}&client_secret=${clientSecret}`
            });
            const tokenData = await tokenRes.json();
            const token = tokenData.access_token;

            // 2. 캐릭터 데이터 가져오기 (예시: 아르카디아 54번 존)
            const query = `
            {
              characterData {
                character(name: "${name}", serverSlug: "${server}", serverRegion: "KR") {
                  zoneRankings(zoneId: 54)
                  recentReports(limit: 5) {
                    data {
                      code
                      title
                      startTime
                      masterData { actors(type: "Player") { name subType } }
                      fights(kill: false) { fightPercentage }
                    }
                  }
                }
              }
            }`;

            const res = await fetch('https://www.fflogs.com/api/v2/client', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const result = await res.json();
            const char = result.data.characterData.character;

            if(!char) throw new Error("캐릭터를 찾을 수 없습니다.");

            // 3. 화면에 그리기
            document.getElementById('setup').style.display = 'none';
            document.getElementById('profile-section').style.display = 'block';
            document.getElementById('raid-section').style.display = 'block';
            
            document.getElementById('p-name').innerText = name;
            document.getElementById('p-server').innerText = server;

            // 레이드 리스트 생성
            const list = document.getElementById('raid-list');
            list.innerHTML = "";
            
            char.recentReports.data.forEach(report => {
                const wipe = report.fights.length > 0 ? Math.min(...report.fights.map(f => f.fightPercentage / 100)) : 0;
                const party = report.masterData.actors.map(a => a.name).join(", ");
                
                list.innerHTML += `
                    <div class="raid-item">
                        <strong>${report.title}</strong>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${100 - (wipe * 100)}%"></div></div>
                        <div class="log-detail">
                            파티원: ${party}<br>
                            기록: <a href="https://ko.fflogs.com/reports/${report.code}" target="_blank" style="color:var(--primary)">원본 로그 보기</a>
                        </div>
                        <div style="margin-top:10px;">
                           <small>장비 기록 (수동): <input type="text" placeholder="예: 아수라 상의" style="width:100px; padding:2px; font-size:10px;"></small>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            alert("에러 발생: " + e.message);
        }
    }

    function changePImg() {
        const url = prompt("이미지 주소를 입력하세요.");
        if(url) document.getElementById('p-img').src = url;
    }
</script>

</body>
</html>
