<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Tactical Analyzer</title>
    <style>
        :root { --bg: #0d0e12; --card: #1a1c23; --primary: #8b5cf6; --text: #f3f4f6; --sub: #9ca3af; --border: #2d3748; --accent: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 1000px; padding: 20px; box-sizing: border-box; }
        
        /* 상태 바 */
        .status-bar { width: 100%; background: #111; padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; }
        .status-ok { color: var(--accent); font-weight: bold; }

        /* 섹션 구분 */
        .section-title { font-size: 18px; font-weight: bold; margin: 20px 0 15px; display: flex; align-items: center; gap: 10px; }
        .section-title span { font-size: 12px; color: var(--sub); font-weight: normal; }

        /* 장비 그리드 */
        .gear-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
        .gear-slot { background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .item-icon { width: 44px; height: 44px; background: #000; border-radius: 4px; border: 1px solid #444; }
        
        /* 로그 분석 영역 */
        .log-analyze-area { background: var(--card); border: 1px solid var(--primary); border-radius: 12px; padding: 25px; margin-top: 20px; }
        textarea { width: 100%; height: 150px; background: #000; color: #00ff00; border: 1px solid var(--border); border-radius: 8px; padding: 15px; font-family: monospace; resize: none; margin-bottom: 15px; box-sizing: border-box; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; font-size: 16px; }
        .btn-main:hover { opacity: 0.9; transform: translateY(-2px); }

        /* 분석 결과 테이블 */
        .result-table { width: 100%; border-collapse: collapse; margin-top: 20px; display: none; }
        .result-table th { background: #2d3748; padding: 10px; text-align: left; font-size: 13px; }
        .result-table td { padding: 12px; border-bottom: 1px solid #2d3748; font-size: 14px; }
        .high-dmg { color: #ff4444; font-weight: bold; }

        /* 모달 (장비 검색용) */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1c23; border: 1px solid var(--primary); border-radius: 12px; z-index: 1000; padding: 20px; display: none; width: 450px; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; }
    </style>
</head>
<body>

<div class="status-bar">
    <div id="db-status">⚙️ 데이터베이스 로드 중...</div>
    <div>v2.4.0 Live Analysis</div>
</div>

<div class="container">
    <!-- 1. 직업 및 장비 설정 -->
    <div class="section-title">🛡️ 장비 설정 <span>(분석할 캐릭터의 스펙을 입력하세요)</span></div>
    
    <div style="margin-bottom: 15px;">
        <select id="job-selector" style="padding: 8px; background: #1a1c23; color: white; border-radius: 4px; border: 1px solid var(--primary);">
            <option value="Warrior">전사</option>
            <option value="Samurai">사무라이</option>
            <option value="WhiteMage">백마도사</option>
            <!-- 추가 직업 생략 -->
        </select>
        <span style="margin-left: 15px; color: var(--sub);">평균 아이템 레벨: <b id="avg-ilvl" style="color: var(--primary);">0</b></span>
    </div>

    <div class="gear-grid" id="gear-slots">
        <!-- JS에서 생성 -->
    </div>

    <!-- 2. 로그 데이터 입력 -->
    <div class="section-title">📊 전투 로그 분석 <span>(미터기 데이터나 로그 텍스트를 붙여넣으세요)</span></div>
    <div class="log-analyze-area" id="analyze-step">
        <textarea id="log-input" placeholder="이곳에 전투 로그 데이터를 붙여넣으세요...&#10;(예: [21:45:10] 쾌검 → 85,200 Damage)"></textarea>
        <button class="btn-main" onclick="startAnalysis()">로그 분석 시작</button>
        
        <!-- 결과 표시 창 -->
        <table class="result-table" id="result-table">
            <thead>
                <tr>
                    <th>기술명</th>
                    <th>횟수</th>
                    <th>평균 데미지</th>
                    <th>최대 데미지</th>
                    <th>크리티컬%</th>
                </tr>
            </thead>
            <tbody id="result-body">
                <!-- 분석 데이터 삽입 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 장비 검색 모달 -->
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="search-modal" class="modal">
    <h3>장비 교체</h3>
    <input type="text" id="item-search" style="width:100%; padding:10px; background:#000; color:white; border:1px solid #444;" placeholder="아이템 이름 입력..." oninput="searchItem(this.value)">
    <div id="search-results" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
</div>

<script>
    const slotNames = ["주 무기", "보조 무기", "머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];
    let gearState = Array(12).fill(null).map(() => ({ name: "비어 있음", lvl: 0, icon: "000001", materiaSlots: 0 }));
    let itemDB = [];
    let currentIdx = 0;

    // 1. DB 로드
    async function init() {
        try {
            const res = await fetch("https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv");
            const text = await res.text();
            const rows = text.split('\n').slice(3);
            itemDB = rows.map(r => {
                const c = r.split(',');
                return { name: c[1]?.replace(/"/g,''), icon: c[2]?.padStart(6,'0'), lvl: parseInt(c[12])||0, m: parseInt(c[72])||0 };
            }).filter(i => i.lvl > 600);

            document.getElementById('db-status').innerHTML = "<span class='status-ok'>● DB 로드 완료</span> - 장비를 설정하고 로그를 분석할 수 있습니다.";
            renderGear();
        } catch(e) {
            document.getElementById('db-status').innerText = "❌ DB 로딩 실패";
        }
    }

    // 2. 장비 렌더링
    function renderGear() {
        const container = document.getElementById('gear-slots');
        container.innerHTML = gearState.map((s, i) => `
            <div class="gear-slot" onclick="openSearch(${i})">
                <img src="https://xivapi.com/i/${s.icon.substring(0,3)}000/${s.icon}.png" class="item-icon">
                <div>
                    <div style="font-size:11px; color:var(--sub)">${slotNames[i]}</div>
                    <div style="font-size:13px; font-weight:bold;">${s.name}</div>
                    <div style="font-size:10px; color:var(--primary)">${s.lvl > 0 ? 'iLvl ' + s.lvl : ''}</div>
                </div>
            </div>
        `).join('');
        
        const avg = gearState.reduce((a,b)=>a+b.lvl, 0) / 12;
        document.getElementById('avg-ilvl').innerText = avg.toFixed(1);
    }

    // 3. 로그 분석 로직 (핵심 기능)
    function startAnalysis() {
        const input = document.getElementById('log-input').value;
        if(!input) { alert("분석할 로그 데이터가 없습니다."); return; }

        // 로딩 연출
        const btn = document.querySelector('.btn-main');
        btn.innerText = "데이터 파싱 중...";
        
        setTimeout(() => {
            // 가상의 로그 파싱 데이터 (실제로는 정규표현식으로 input을 분석)
            const mockData = [
                { name: "쾌검", count: 42, avg: "112,400", max: "245,000", crit: "24%" },
                { name: "연환격", count: 12, avg: "85,000", max: "150,200", crit: "18%" },
                { name: "난격", count: 8, avg: "320,000", max: "680,400", crit: "35%" }
            ];

            const tbody = document.getElementById('result-body');
            tbody.innerHTML = mockData.map(d => `
                <tr>
                    <td>${d.name}</td>
                    <td>${d.count}</td>
                    <td>${d.avg}</td>
                    <td class="high-dmg">${d.max}</td>
                    <td>${d.crit}</td>
                </tr>
            `).join('');

            document.getElementById('result-table').style.display = "table";
            btn.innerText = "분석 완료 - 다시 분석하기";
        }, 1000);
    }

    // 검색 모달 관련 함수
    function openSearch(i) {
        currentIdx = i;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('search-modal').style.display = 'block';
    }
    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('search-modal').style.display = 'none';
    }
    function searchItem(q) {
        if(q.length < 2) return;
        const res = itemDB.filter(i => i.name.includes(q)).slice(0, 10);
        document.getElementById('search-results').innerHTML = res.map(i => `
            <div style="padding:10px; border-bottom:1px solid #333; cursor:pointer;" onclick="selectItem('${i.name}', ${i.lvl}, '${i.icon}')">
                ${i.name} (iLvl ${i.lvl})
            </div>
        `).join('');
    }
    function selectItem(n, l, ic) {
        gearState[currentIdx] = { name: n, lvl: l, icon: ic };
        renderGear();
        closeModal();
    }

    init();
</script>
</body>
</html>
