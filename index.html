<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Gear Inspector Final</title>
    <style>
        :root { --bg: #0d0e12; --card: #14151a; --primary: #a855f7; --text: #e5e7eb; --sub: #9ca3af; --border: #262626; --accent: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 950px; }
        
        /* 1. 설정 섹션 (API & 캐릭터 설정) */
        .config-section { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 8px; text-transform: uppercase; }
        .input-field { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; box-sizing: border-box; outline: none; }
        .input-field:focus { border-color: var(--primary); }
        .btn-update { width: 100%; background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-update:hover { opacity: 0.8; }

        /* 2. 분석 상태 표시 */
        #status-msg { display: none; text-align: center; padding: 30px; color: var(--primary); font-weight: bold; font-size: 14px; }

        /* 3. 분석 결과 영역 */
        #results-area { display: none; width: 100%; }
        
        /* 장비 정보 패널 (인스펙터) */
        .inspector-panel { background: #0a0a0c; border: 1px solid var(--primary); border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .inspector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .gear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .gear-item { background: #111; border: 1px solid #222; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 15px; }
        .gear-img { width: 44px; height: 44px; border-radius: 4px; border: 1px solid #444; background: #000; }

        /* 리포트 카드 */
        .report-card { background: var(--card); border-left: 4px solid #ff4444; border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .party-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .member-node { background: #1a1c23; border: 1px solid #333; padding: 12px; border-radius: 4px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
        .member-node:hover { border-color: var(--primary); background: #252832; }
    </style>
</head>
<body>

<div class="container">
    <!-- 설정 섹션 -->
    <div class="config-section">
        <div class="input-row">
            <div class="input-group">
                <label>FFLogs Client ID</label>
                <input type="text" id="client-id" class="input-field" placeholder="Client ID">
            </div>
            <div class="input-group">
                <label>Client Secret</label>
                <input type="password" id="client-secret" class="input-field" placeholder="Client Secret">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>Character Name</label>
                <input type="text" id="char-name" class="input-field" placeholder="캐릭터 이름">
            </div>
            <div class="input-group">
                <label>Server</label>
                <select id="server-select" class="input-field">
                    <option value="Chocobo">초코보</option>
                    <option value="Moogle">모그리</option>
                    <option value="Carbuncle">카벙클</option>
                    <option value="Tonberry">톤베리</option>
                    <option value="Fenrir">펜리르</option>
                </select>
            </div>
        </div>
        <button class="btn-update" onclick="runAnalysis()">데이터 가져오기 및 장비 분석</button>
    </div>

    <!-- 로딩 표시 -->
    <div id="status-msg">FFLogs API 통신 중... 장비 데이터를 구성하고 있습니다.</div>

    <!-- 분석 결과 영역 -->
    <div id="results-area">
        <!-- 장비 인스펙터 창 -->
        <div id="inspector" class="inspector-panel" style="display:none;">
            <div class="inspector-header">
                <div>
                    <h2 id="target-user" style="margin: 0; color: #fff;">캐릭터이름</h2>
                    <div id="target-job" style="font-size: 11px; color: var(--sub); text-transform: uppercase; margin-top: 4px;">Job Info</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 11px; color: var(--sub);">AVERAGE ITEM LEVEL</div>
                    <div id="avg-ilvl-val" style="font-size: 30px; font-weight: bold; color: var(--accent);">0.00</div>
                </div>
            </div>
            <div id="gear-display" class="gear-grid"></div>
            <button onclick="document.getElementById('inspector').style.display='none'" style="margin-top:20px; width:100%; background:#222; border:1px solid #333; color:#fff; padding:12px; cursor:pointer; border-radius:6px; font-weight:bold;">인스펙터 닫기</button>
        </div>

        <!-- 리포트 레이아웃 -->
        <div id="report-output"></div>
    </div>
</div>

<script>
    let itemDB = new Map();
    const slotNames = ["주무기", "보조무기", "머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];

    // 1. CSV DB 로드 (아이콘 및 아이템 레벨 매핑용)
    async function initDB() {
        try {
            const res = await fetch("https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv");
            const data = await res.text();
            data.split('\n').slice(3).forEach(line => {
                const c = line.split(',');
                if(c[0]) itemDB.set(c[0].trim(), { 
                    name: c[1]?.replace(/"/g,''), 
                    icon: c[2]?.padStart(6,'0'), 
                    ilvl: parseInt(c[12])||0 
                });
            });
        } catch(e) { console.error("DB 로딩 실패"); }
    }

    // 2. 분석 실행 (화면 전환 핵심)
    function runAnalysis() {
        const char = document.getElementById('char-name').value;
        const cid = document.getElementById('client-id').value;

        if(!char || !cid) {
            alert("API 정보와 캐릭터명을 정확히 입력해주세요.");
            return;
        }

        // 로딩 화면 전환
        document.getElementById('status-msg').style.display = 'block';
        document.getElementById('results-area').style.display = 'none';

        // 분석 시뮬레이션 (실제 API 호출 시 이 위치에 fetch 로직 삽입)
        setTimeout(() => {
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('results-area').style.display = 'block';
            renderReport(char);
        }, 1000);
    }

    // 3. 리포트 생성 및 팀원 명단 출력
    function renderReport(mainChar) {
        const container = document.getElementById('report-output');
        const teamMembers = [mainChar, "가웨인", "번탈녀", "예현", "카나스", "제세", "참영", "A'ster"];
        
        container.innerHTML = `
            <div class="report-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold; font-size:18px;">최근 로그 분석 결과 (절 또 하나의 미래)</span>
                    <span style="color:#ff4444; font-weight:bold; font-size:18px;">1.0%</span>
                </div>
                <div class="party-grid">
                    ${teamMembers.map(name => `
                        <div class="member-node" onclick="inspectGear('${name}')">
                            <img src="https://assets.rpglogs.com/img/ff/icons/Warrior.png" width="18" style="opacity:0.7">
                            <span>${name}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    // 4. 장비 정보 조회 (평균 템렙 계산 및 이미지 렌더링)
    function inspectGear(name) {
        // 실제 API 연동 시에는 각 유저별 gearIds 배열을 가져오게 됩니다.
        const mockGearIds = ["42431", "42432", "42433", "42434", "42435", "42436", "42437", "42438", "42439", "42440", "42441", "42441"];
        
        let totalIlvl = 0;
        const html = mockGearIds.map((id, i) => {
            const item = itemDB.get(id) || { name: "알 수 없는 장비", ilvl: 0, icon: "000001" };
            totalIlvl += item.ilvl;
            const iconUrl = `https://xivapi.com/i/${item.icon.substring(0,3)}000/${item.icon}.png`;

            return `
                <div class="gear-item">
                    <img src="${iconUrl}" class="gear-img" onerror="this.src='https://xivapi.com/i/000000/000001.png'">
                    <div style="flex-grow:1; overflow:hidden;">
                        <div style="font-size:9px; color:var(--sub);">${slotNames[i]}</div>
                        <div style="font-size:11px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">${item.name}</div>
                    </div>
                    <div style="font-size:11px; color:var(--primary); font-weight:bold;">i${item.ilvl}</div>
                </div>
            `;
        }).join('');

        document.getElementById('target-user').innerText = name;
        document.getElementById('avg-ilvl-val').innerText = (totalIlvl / 12).toFixed(2);
        document.getElementById('gear-display').innerHTML = html;
        
        const inspector = document.getElementById('inspector');
        inspector.style.display = 'block';
        
        // 인스펙터 위치로 자동 스크롤
        window.scrollTo({ top: inspector.offsetTop - 20, behavior: 'smooth' });
    }

    initDB();
</script>
</body>
</html>
