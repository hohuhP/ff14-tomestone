<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FFXIV Pro Gear Editor</title>
    <style>
        :root { --bg: #0b0c10; --card: #14151a; --primary: #a855f7; --text: #e5e7eb; --sub: #9ca3af; --border: #262626; --accent: #10b981; --materia: #3b82f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; }
        .wrapper { max-width: 1200px; margin: 0 auto; }
        
        /* 설정 섹션 */
        .config-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .input-field { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; outline: none; }
        .btn-main { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 로그 요약 바 */
        .log-header { background: linear-gradient(90deg, #1a1c23, #0d0e12); border: 1px solid var(--primary); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .log-info h2 { margin: 0; font-size: 1.2rem; }
        .log-info span { color: var(--sub); font-size: 0.9rem; }

        /* 장비 그리드 */
        .gear-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .gear-card { background: #111; border: 1px solid #222; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .gear-card.editing { border-color: var(--primary); box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
        .gear-icon { width: 52px; height: 52px; border-radius: 6px; border: 1px solid #333; cursor: pointer; }
        
        .materia-group { display: flex; gap: 6px; margin-top: 8px; }
        .materia-slot { width: 20px; height: 20px; border-radius: 50%; background: #222; border: 1px solid #444; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .materia-slot img { width: 100%; height: 100%; }

        /* 검색 모달 */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: var(--card); border: 1px solid var(--primary); border-radius: 12px; z-index: 1000; padding: 20px; }
        #search-results { max-height: 300px; overflow-y: auto; margin-top: 10px; }
        .search-item { display: flex; align-items: center; gap: 10px; padding: 8px; cursor: pointer; border-bottom: 1px solid #222; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="config-box">
        <input type="text" id="api-key" class="input-field" placeholder="FFLogs API Key (v2)">
        <input type="text" id="report-id" class="input-field" placeholder="Report ID (예: JxY9V7K2b...) ">
        <button class="btn-main" onclick="fetchRealLog()">로그 데이터 가져오기</button>
    </div>

    <div id="main-content" style="display:none;">
        <div class="log-header">
            <div class="log-info">
                <span id="log-date">DATE: 2026-05-13</span>
                <h2 id="log-title">REPORT TITLE</h2>
                <div id="char-list" style="margin-top:10px; display:flex; gap:10px;"></div>
            </div>
            <div style="text-align:right">
                <button id="edit-all-btn" class="btn-main" style="background:var(--accent);" onclick="toggleEditMode()">모든 장비 수정 모드</button>
                <div id="avg-display" style="font-size:24px; font-weight:bold; color:var(--primary); margin-top:10px;">i000.00</div>
            </div>
        </div>

        <div id="gear-grid" class="gear-container"></div>
    </div>
</div>

<div id="modal-overlay" class="overlay" onclick="closeModal()"></div>
<div id="search-modal" class="modal">
    <h4 id="modal-title" style="margin:0 0 15px 0;">아이템 검색</h4>
    <input type="text" id="search-input" class="input-field" style="width:100%; box-sizing:border-box;" placeholder="이름으로 검색..." oninput="filterItems(this.value)">
    <div id="search-results"></div>
</div>

<script>
    let itemDB = [];
    let materiaDB = [];
    let isEditMode = false;
    let currentLogData = null;
    let activeSelection = { slotIdx: null, matIdx: null };

    // 1. 한국어 DB 로드
    async function loadDB() {
        const res = await fetch("https://raw.githubusercontent.com/Ra-Workspace/ffxiv-datamining-ko/master/csv/Item.csv");
        const text = await res.text();
        itemDB = text.split('\n').slice(3).map(line => {
            const c = line.split(',');
            return { id: c[0]?.trim(), name: c[1]?.replace(/"/g,''), icon: c[2]?.padStart(6,'0'), ilvl: parseInt(c[12])||0 };
        }).filter(i => i.name);
        materiaDB = itemDB.filter(i => i.name.includes("마테리"));
    }

    // 2. 실제 로그 가져오기 (FFLogs API v2 시뮬레이션 및 연동 구조)
    async function fetchRealLog() {
        const reportId = document.getElementById('report-id').value;
        if(!reportId) return alert("Report ID를 입력해주세요.");

        // 실제 구현 시 여기서 GQL 호출
        // 아래는 API로부터 받아온 데이터를 가정함
        currentLogData = {
            title: "희망의 낙원 에덴: 재생편 4 (영웅)",
            date: "2026-05-13",
            gear: Array(12).fill(null).map(() => ({ id: "42431", materias: Array(5).fill(null) }))
        };

        document.getElementById('log-title').innerText = currentLogData.title;
        document.getElementById('main-content').style.display = 'block';
        renderGear();
    }

    // 3. 통합 수정 모드 토글
    function toggleEditMode() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('edit-all-btn');
        btn.innerText = isEditMode ? "수정 완료 (저장)" : "모든 장비 수정 모드";
        btn.style.background = isEditMode ? "var(--primary)" : "var(--accent)";
        renderGear();
    }

    function renderGear() {
        const slots = ["주무기", "보조무기", "머리", "상의", "장갑", "하의", "신발", "귀걸이", "목걸이", "팔찌", "반지 1", "반지 2"];
        let totalIlvl = 0;

        const html = currentLogData.gear.map((g, i) => {
            const item = itemDB.find(it => it.id === g.id) || { name: "알 수 없음", icon: "000001", ilvl: 0 };
            totalIlvl += item.ilvl;
            return `
                <div class="gear-card ${isEditMode ? 'editing' : ''}">
                    <img class="gear-icon" src="https://xivapi.com/i/${item.icon.substring(0,3)}000/${item.icon}.png" 
                         onclick="${isEditMode ? `openModal(${i}, null)` : ''}">
                    <div style="flex:1">
                        <div style="font-size:11px; color:var(--sub)">${slots[i]}</div>
                        <div style="font-weight:bold; font-size:14px;">${item.name}</div>
                        <div class="materia-group">
                            ${g.materias.map((mId, mIdx) => {
                                const m = materiaDB.find(mat => mat.id === mId);
                                return `<div class="materia-slot" onclick="${isEditMode ? `openModal(${i}, ${mIdx})` : ''}">
                                    ${m ? `<img src="https://xivapi.com/i/${m.icon.substring(0,3)}000/${m.icon}.png">` : '+'}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                    <div style="color:var(--accent); font-weight:bold;">i${item.ilvl}</div>
                </div>
            `;
        }).join('');

        document.getElementById('gear-grid').innerHTML = html;
        document.getElementById('avg-display').innerText = `i${(totalIlvl/12).toFixed(2)}`;
    }

    // 4. 검색 및 교체
    function openModal(sIdx, mIdx) {
        activeSelection = { sIdx, mIdx };
        document.getElementById('modal-title').innerText = mIdx === null ? "장비 검색" : "마테리아 검색";
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('search-modal').style.display = 'block';
        document.getElementById('search-input').value = "";
        document.getElementById('search-results').innerHTML = "";
    }

    function filterItems(query) {
        if(query.length < 2) return;
        const db = activeSelection.mIdx === null ? itemDB : materiaDB;
        const filtered = db.filter(i => i.name.includes(query)).slice(0, 20);
        
        document.getElementById('search-results').innerHTML = filtered.map(item => `
            <div class="search-item" onclick="applySelection('${item.id}')">
                <img src="https://xivapi.com/i/${item.icon.substring(0,3)}000/${item.icon}.png" width="30">
                <span>${item.name} (i${item.ilvl})</span>
            </div>
        `).join('');
    }

    function applySelection(id) {
        const { sIdx, mIdx } = activeSelection;
        if(mIdx === null) currentLogData.gear[sIdx].id = id;
        else currentLogData.gear[sIdx].materias[mIdx] = id;
        renderGear();
        closeModal();
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('search-modal').style.display = 'none';
    }

    loadDB();
</script>
</body>
</html>
